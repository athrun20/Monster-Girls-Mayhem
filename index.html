<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Monster Girls Mayhem</title>
<style>
  :root {
    --bg: #140a22;
    --pink: #ff2d95;
    --cyan: #00f0ff;
    --yellow: #ffee00;
    --purple: #b026ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    width: 100%; height: 100%; min-height: 100vh;
    background: var(--bg); color: #fff;
    font-family: system-ui, "Segoe UI", Arial, sans-serif;
    overflow: hidden; overflow-x: hidden;
  }
  #app {
    max-width: 430px; margin: 0 auto; height: 100%; min-height: 100vh;
    position: relative; background: #140a22;
    overflow: hidden; overflow-x: hidden;
  }
  @media (min-width: 800px) {
    #app { max-width: min(1180px, 100%); }
  }
  .screen {
    display: none; flex-direction: column;
    position: absolute; inset: 0; padding: 12px;
    background: #140a22;
    overflow-x: hidden;
  }
  .screen.on { display: flex; }
  h1 {
    text-align: center; font-size: 1.2rem; letter-spacing: 2px;
    color: var(--yellow); margin: 8px 0 12px;
  }
  .btn {
    display: block; width: 100%; max-width: 320px; margin: 8px auto;
    padding: 14px 18px; border-radius: 999px; border: 2px solid #fff;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: #fff; font-weight: 800; font-size: 1rem; letter-spacing: 1px;
    cursor: pointer; min-height: 52px;
  }
  .btn.secondary { background: #222; border-color: var(--cyan); }
  .btn:disabled { opacity: 0.4; }
  .btn.small { max-width: 160px; min-height: 44px; font-size: 0.85rem; padding: 10px; }

  /* TITLE — logo art + TAP TO PLAY, no clutter over faces */
  #s-title {
    align-items: center; justify-content: flex-end;
    gap: 10px; text-align: center;
    padding: 12px 12px 20px;
  }
  #s-title .art {
    flex: 1; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #s-title img {
    max-width: 96%; max-height: 100%;
    width: auto; height: auto;
    object-fit: contain;
    background: transparent;
    border: none; border-radius: 0;
    mix-blend-mode: normal;
  }
  #s-title .logo {
    font-size: 0.95rem; font-weight: 900; color: var(--pink); letter-spacing: 2px;
  }
  #s-title .logo2 {
    font-size: 1.35rem; font-weight: 900; color: var(--yellow); letter-spacing: 3px;
    margin-bottom: 4px;
  }
  #s-title #btn-start {
    width: min(320px, 92%);
    min-height: 56px;
    font-size: 1.1rem;
  }

  /* MODE — full-bleed group art, cards under */
  #s-mode { padding: 0; }
  #s-mode .hero {
    flex: 1; min-height: 0;
    background: url('assets/mode.jpg') center top / cover no-repeat #0a0614;
  }
  #s-mode .panel {
    flex-shrink: 0; padding: 10px 12px 14px;
    background: transparent;
  }
  .modes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; max-width: 420px; margin: 0 auto; }
  .modes .btn {
    max-width: none; margin: 0;
    min-height: 52px; padding: 8px 10px;
    font-size: 0.8rem; letter-spacing: 1px;
    border-radius: 14px; text-align: left;
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
    background: rgba(10,6,20,0.42) !important;
    border: 1px solid rgba(255,255,255,0.28) !important;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .modes .btn.secondary { background: rgba(10,6,20,0.38) !important; }
  .modes .btn span { font-size: 0.6rem; font-weight: 600; opacity: 0.8; letter-spacing: 0; }
  .modes .btn.wide { grid-column: auto; }

  /* DIFF — full-bleed art, controls under faces */
  #s-diff {
    padding: 0;
    justify-content: flex-end;
    background: url('assets/diff.png') center top / cover no-repeat #0a0614;
  }
  #s-diff h1 { display: none; }
  #s-diff .diff-bar {
    width: 100%;
    padding: 16px 12px 20px;
    background: transparent;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .diffs { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  .diffs .btn {
    flex: 1; margin: 0; max-width: none; font-size: 0.72rem;
    min-height: 58px; padding: 8px 6px; border-radius: 12px;
    display: flex; flex-direction: column; gap: 2px;
    background: rgba(10,6,20,0.42) !important;
    border: 1px solid rgba(255,255,255,0.28) !important;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .diffs .btn.secondary { background: rgba(10,6,20,0.38) !important; }
  .diffs .btn span { font-size: 0.56rem; font-weight: 600; opacity: 0.8; }

  /* CHAR SELECT — original 3-zone on wide screens, stacked showcase on phone */
  #s-char {
    padding: 0;
    background: #0a0614;
    overflow: hidden;
  }
  #s-char .world {
    position: absolute; inset: 0; z-index: 0;
    background-size: cover; background-position: center top;
    filter: saturate(1.15) brightness(0.7);
    transition: background-image 0.3s ease;
  }
  #s-char .world::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(8,4,18,0.72) 0%, rgba(8,4,18,0.28) 42%, rgba(8,4,18,0.78) 100%);
    pointer-events: none;
  }
  #s-char .char-shell {
    position: relative; z-index: 2;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto auto auto;
    grid-template-areas:
      "head"
      "art"
      "info"
      "roster"
      "act";
    height: 100%;
    padding: 8px 10px 10px;
    gap: 6px;
  }
  #s-char .char-head {
    grid-area: head;
    display: flex; align-items: center; gap: 10px;
  }
  #s-char .char-mode {
    font-size: 0.68rem; letter-spacing: 2px;
    color: var(--cyan); font-weight: 800; opacity: 0.9;
  }
  #s-char .char-hero-name { display: none; }
  .char-preview {
    grid-area: art;
    min-height: 0;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .char-preview img#char-big {
    max-height: 100%; max-width: 100%;
    object-fit: contain; object-position: center bottom;
    filter: drop-shadow(0 0 22px rgba(255,45,149,0.35));
    transition: opacity 0.22s ease, transform 0.28s ease;
  }
  .char-preview img#char-big.swap { opacity: 0; transform: translateY(8px); }
  .char-info {
    grid-area: info;
    background: rgba(12,8,24,0.82);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px;
    padding: 10px 12px;
    overflow: auto;
  }
  .char-info .kicker { font-size: 0.68rem; letter-spacing: 2px; color: var(--yellow); }
  .char-info h3 { font-size: 1.35rem; letter-spacing: 2px; margin: 2px 0 4px; }
  .char-info .tags { font-size: 0.68rem; letter-spacing: 1px; opacity: 0.9; margin: 4px 0; }
  .char-info .world-name { font-size: 0.68rem; color: var(--cyan); letter-spacing: 1px; margin-top: 6px; }
  .char-info .blurb { opacity: 0.85; font-size: 0.78rem; line-height: 1.35; }
  .char-info .statline { font-size: 0.68rem; opacity: 0.8; margin-top: 4px; }
  .char-row {
    grid-area: roster;
    display: flex; gap: 6px; overflow-x: auto;
    padding: 2px 0 4px;
    scrollbar-width: none;
  }
  .char-row::-webkit-scrollbar { display: none; }
  .char-item {
    flex: 0 0 72px; min-height: 44px;
    text-align: left; cursor: pointer;
    border: 2px solid rgba(255,255,255,0.18); border-radius: 12px;
    padding: 5px; background: rgba(16,10,28,0.9);
    display: flex; flex-direction: column; align-items: center;
    color: #fff; font-family: inherit;
  }
  .char-item.on {
    border-color: var(--pink);
    box-shadow: 0 0 14px rgba(255,45,149,0.45);
  }
  .char-item img {
    width: 52px; height: 52px; object-fit: contain; object-position: center top;
    border-radius: 8px; display: block; margin-bottom: 3px;
  }
  .char-item span { font-size: 0.62rem; font-weight: 800; display: block; }
  .char-item small { font-size: 0.52rem; opacity: 0.7; display: block; }
  #s-char .char-actions { grid-area: act; }
  #btn-char-go {
    width: 100%; margin: 0;
    min-height: 52px; letter-spacing: 2px;
  }
  #btn-char-back { margin: 0; }

  @media (min-width: 800px) {
    #s-char .char-shell {
      grid-template-columns: 220px minmax(0, 1fr) 280px;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "head head head"
        "roster art info"
        "roster art act";
      padding: 14px 16px 16px;
      gap: 12px;
    }
    .char-row {
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
      gap: 8px;
    }
    .char-item {
      flex: 0 0 auto;
      width: 100%;
      flex-direction: row;
      gap: 8px;
      text-align: left;
      padding: 8px;
    }
    .char-item img { width: 48px; height: 48px; margin: 0; }
    .char-preview { align-items: center; }
    .char-preview img#char-big { max-height: 92%; }
  }

  /* VS / COUNT */
  #s-vs, #s-count, #s-ko, #s-results {
    align-items: center; justify-content: center; gap: 12px; text-align: center;
  }
  .vs-row { display: flex; align-items: center; gap: 12px; }
  .vs-row img {
    width: 38vw; max-width: 180px; height: 48vw; max-height: 240px;
    object-fit: contain; object-position: center top;
    border-radius: 12px;
  }
  #s-vs, #s-count {
    background-size: cover; background-position: center;
  }
  #count-num {
    font-size: 4rem; font-weight: 900; color: var(--yellow);
    text-shadow: 0 0 24px #ff0;
  }

  /* BATTLE */
  #s-battle {
    padding: 0;
    background: #0a0614 center top / cover no-repeat;
    background-color: #0a0614;
  }
  #hud {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 6px 8px 2px; flex-shrink: 0;
  }
  .chip {
    display: flex; align-items: center; gap: 6px;
    background: rgba(8,4,18,0.72); border: 1px solid rgba(0,240,255,0.35);
    border-radius: 12px; padding: 3px 8px 3px 3px;
  }
  .chip img {
    width: 34px; height: 34px; border-radius: 8px; object-fit: contain; object-position: top;
  }
  .chip .meta { font-size: 0.65rem; font-weight: 700; }
  .sp {
    width: 72px; height: 6px; background: #222; border-radius: 4px; margin-top: 3px; overflow: hidden;
  }
  .sp > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--pink)); }
  #incoming {
    flex-shrink: 0; height: 18px; text-align: center;
    font-size: 0.65rem; letter-spacing: 1px; font-weight: 800;
    color: var(--yellow); opacity: 0;
  }
  #incoming.show { opacity: 1; }
  #incoming img { width: 18px; height: 18px; object-fit: contain; vertical-align: middle; margin: 0 4px; }
  #danger-tag {
    position: absolute; top: 52px; left: 10px; z-index: 6;
    font-size: 0.7rem; font-weight: 900; letter-spacing: 2px; color: #ff4466;
    text-shadow: 0 0 10px #f06; opacity: 0; pointer-events: none;
  }
  #danger-tag.on { opacity: 1; }
  #board-wrap {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    padding: 2px 6px;
  }
  #board {
    display: block;
    border: 1px solid rgba(0,240,255,0.28);
    border-radius: 8px;
    background: rgba(10,6,22,0.78);
    touch-action: none;
  }
  #dock {
    flex-shrink: 0;
    background: transparent;
    padding: 6px 10px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .dock-row { display: flex; gap: 8px; justify-content: center; align-items: center; }
  .dbtn {
    width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--cyan);
    background: rgba(8,16,28,0.85); color: #fff; font-size: 0.95rem; font-weight: 800;
    cursor: pointer;
  }
  .dbtn.wide {
    width: 72px; border-radius: 22px; border-color: var(--pink); font-size: 0.68rem;
  }
  .dbtn.special {
    width: auto; min-width: 110px; padding: 0 12px; border-radius: 22px;
    border-color: var(--yellow); font-size: 0.68rem;
  }
  .dbtn.special.on {
    background: linear-gradient(135deg, var(--pink), var(--purple));
    box-shadow: 0 0 14px rgba(255,45,149,0.6);
  }
  .dbtn:active { transform: scale(0.94); }
  #pause-ov {
    display: none; position: absolute; inset: 0; z-index: 20;
    background: rgba(8,4,18,0.55); align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
  }
  #pause-ov.on { display: flex; }
  #chain {
    position: absolute; top: 52px; left: 50%; transform: translate(-50%,-6px) scale(0.7);
    font-size: 1.35rem; font-weight: 900; letter-spacing: 0.12em;
    color: #fff6a8; text-shadow: 0 0 14px #ffd84a, 0 2px 0 #3a1040;
    opacity: 0; pointer-events: none; z-index: 6;
    transition: opacity .08s, transform .12s cubic-bezier(.2,1.4,.3,1);
  }
  #chain.show { opacity: 1; transform: translate(-50%,0) scale(1); }
  #chain.big { font-size: 1.7rem; color: #ff9ad5; text-shadow: 0 0 18px #ff2bd6; }
  #mayhem-tag {
    position: absolute; top: 42%; left: 50%; transform: translate(-50%,-50%) scale(0.6);
    font-size: 2.1rem; font-weight: 900; letter-spacing: 0.18em; color: #fff;
    text-shadow: 0 0 22px #ff2bd6, 0 0 8px #00f0ff;
    opacity: 0; pointer-events: none; z-index: 7;
    transition: opacity .1s, transform .16s cubic-bezier(.15,1.5,.3,1);
  }
  #mayhem-tag.on { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .chip img.react { animation: react 0.28s ease; }
  @keyframes react { 0%{transform:scale(1)} 40%{transform:scale(1.12) translateY(-2px)} 100%{transform:scale(1)} }
  .chip.aura { box-shadow: 0 0 14px currentColor; }
  #s-results .res-art { display:flex; gap:16px; align-items:center; justify-content:center; margin:8px 0 12px; }
  #s-results .res-art img { width:92px; height:92px; object-fit:contain; filter:drop-shadow(0 0 12px #ff2bd688); }
  #s-results .res-stats { font-size:0.86rem; line-height:1.7; opacity:0.9; }
</style>
</head>
<body>
<div id="app">

  <div id="s-title" class="screen on">
    <div class="art">
      <img id="title-img" src="assets/title.png" alt="Monster Girls Mayhem"
        onerror="this.style.display='none'; this.parentNode.nextElementSibling.style.display='block';" />
    </div>
    <div class="logo" style="display:none;">MONSTER GIRLS</div>
    <div class="logo2" style="display:none;">MAYHEM</div>
    <button class="btn" id="btn-start" type="button">TAP TO PLAY</button>
  </div>

  <div id="s-mode" class="screen">
    <div class="hero" id="mode-hero"></div>
    <div class="panel">
      <div class="modes">
        <button class="btn" type="button" data-mode="story">STORY<span>Play the campaign</span></button>
        <button class="btn" type="button" data-mode="vscpu">VS CPU<span>Challenge a Monster Girl</span></button>
        <button class="btn secondary" type="button" data-mode="training">TRAINING<span>Practice chains</span></button>
      </div>
      <button class="btn secondary small" type="button" id="btn-mode-back">BACK</button>
    </div>
  </div>

  <div id="s-diff" class="screen">
    <div class="diff-bar">
      <div class="diffs">
        <button class="btn secondary" type="button" data-diff="easy">EASY<span>Slower rise</span></button>
        <button class="btn" type="button" data-diff="normal">NORMAL<span>Arcade pace</span></button>
        <button class="btn secondary" type="button" data-diff="hard">HARD<span>Fast + 6 colors</span></button>
      </div>
      <button class="btn" type="button" id="btn-diff-next">NEXT</button>
      <button class="btn secondary small" type="button" id="btn-diff-back">BACK</button>
    </div>
  </div>

  <div id="s-char" class="screen">
    <div class="world" id="char-world"></div>
    <div class="char-shell">
      <div class="char-head">
        <button class="btn secondary small" type="button" id="btn-char-back">BACK</button>
        <div class="char-mode" id="char-mode">CHOOSE YOUR FIGHTER</div>
      </div>
      <div class="char-row" id="char-row"></div>
      <div class="char-preview"><img id="char-big" src="" alt="" /></div>
      <div class="char-info" id="char-info"></div>
      <div class="char-actions">
        <button class="btn" type="button" id="btn-char-go">SELECT</button>
      </div>
    </div>
  </div>

  <div id="s-vs" class="screen">
    <div id="vs-label" style="opacity:0.7;font-size:0.8rem;"></div>
    <div class="vs-row">
      <img id="vs-p1" src="" alt="" />
      <div style="font-weight:900;color:var(--yellow);">VS</div>
      <img id="vs-p2" src="" alt="" />
    </div>
    <div id="vs-names" style="font-weight:700;"></div>
    <div id="vs-line" style="opacity:0.8;font-size:0.85rem;max-width:280px;"></div>
  </div>

  <div id="s-count" class="screen">
    <div id="count-num">3</div>
  </div>

  <div id="s-battle" class="screen">
    <div id="hud">
      <div class="chip">
        <img id="h1img" src="" alt="" />
        <div>
          <div class="meta" id="h1name">P1</div>
          <div class="sp"><i id="h1sp"></i></div>
        </div>
      </div>
      <div class="chip" id="h2chip" style="display:none;">
        <div style="text-align:right;">
          <div class="meta" id="h2name">CPU</div>
          <div class="sp" style="margin-left:auto;"><i id="h2sp"></i></div>
        </div>
        <img id="h2img" src="" alt="" />
      </div>
    </div>
    <div id="incoming"></div>
    <div id="danger-tag">DANGER</div>
    <div id="chain">CHAIN 2</div>
    <div id="mayhem-tag">MAYHEM!</div>
    <div id="board-wrap"><canvas id="board" width="300" height="600"></canvas></div>
    <div id="dock">
      <div class="dock-row">
        <button class="dbtn" type="button" id="b-up">▲</button>
      </div>
      <div class="dock-row">
        <button class="dbtn" type="button" id="b-left">◀</button>
        <button class="dbtn wide" type="button" id="b-swap">SWAP</button>
        <button class="dbtn" type="button" id="b-right">▶</button>
      </div>
      <div class="dock-row">
        <button class="dbtn" type="button" id="b-down">▼</button>
        <button class="dbtn wide" type="button" id="b-raise">RAISE</button>
        <button class="dbtn special" type="button" id="b-special" disabled>SPECIAL</button>
        <button class="dbtn" type="button" id="b-pause">❚❚</button>
      </div>
    </div>
    <div id="pause-ov">
      <h1>PAUSED</h1>
      <button class="btn" type="button" id="btn-resume">RESUME</button>
      <button class="btn secondary" type="button" id="btn-restart">RESTART</button>
      <button class="btn secondary" type="button" id="btn-quit">QUIT</button>
    </div>
  </div>

  <div id="s-ko" class="screen">
    <h1 id="ko-title">K.O.!</h1>
    <div id="ko-sub" style="opacity:0.8;"></div>
  </div>

  <div id="s-results" class="screen">
    <h1 id="res-title">RESULTS</h1>
    <div id="res-note" style="opacity:0.8;font-size:0.85rem;"></div>
    <div class="res-art">
      <img id="res-p1" alt="" />
      <div id="res-vs" style="font-weight:900;color:var(--yellow)">VS</div>
      <img id="res-p2" alt="" />
    </div>
    <div id="res-winner" style="font-weight:800;letter-spacing:.08em;margin-bottom:8px;"></div>
    <div class="res-stats">
      Max Chain: <span id="res-chain">0</span><br/>
      Gems Cleared: <span id="res-cleared">0</span>
    </div>
    <button class="btn" type="button" id="btn-retry">REMATCH</button>
    <button class="btn" type="button" id="btn-continue" style="display:none;">CONTINUE</button>
    <button class="btn secondary" type="button" id="btn-modes">MODE SELECT</button>
  </div>

</div>

<script>
(function () {
  'use strict';

  const COLS = 6, ROWS = 12;
  const COLORS = ['#ff3b3b', '#ffd700', '#c084fc', '#4ade80', '#22d3ee', '#7c3aed'];
  const CHARS = [

        else S.cpuFreeze = Math.max(S.cpuFreeze, 140);
        break;
      case 3: clearGarb(b); clearRandom(b, 6); break;
      case 4:
        for (let r = ROWS - 2; r < ROWS; r++) for (let c = 0; c < COLS; c++) b[r][c] = null;
        gravity(b);
        break;
      case 5:
        for (let r = 0; r < 2; r++) for (let c = 0; c < COLS; c++) b[r][c] = null;
        gravity(b);
        break;
    }
    draw();
  }

  function updateSpecial() {

  // --- AI ---
  function scoreSwap(board, c, r) {
    const a = board[r][c], b = board[r][c + 1];
    if (a == null || b == null || isGarb(a) || isGarb(b)) return 0;
    board[r][c] = b; board[r][c + 1] = a;
    const hit = findMatches(board);
    board[r][c] = a; board[r][c + 1] = b;
    if (!hit) return 0;
    let n = 0;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (hit[y][x]) n++;
    return n;
  }
  function persona() {
    const id = garbageOwner();
    const base = [
      { think: 0.82, miss: 0.10, raise: 0.08 },
      { think: 0.62, miss: 0.08, raise: 0.12 },
      { think: 1.18, miss: 0.16, raise: 0.04 },
      { think: 1.08, miss: 0.12, raise: 0.05 },
      { think: 0.92, miss: 0.10, raise: 0.07 },
      { think: 0.78, miss: 0.14, raise: 0.10 }
    ][id] || { think: 1, miss: 0.1, raise: 0.06 };
    const d = S.diff === 'easy' ? { t: 1.45, m: 0.22 } : S.diff === 'hard' ? { t: 0.68, m: -0.05 } : { t: 1, m: 0 };
    return { think: base.think * d.t, miss: Math.max(0.02, base.miss + d.m), raise: base.raise };
  }
  function runAI(dt) {
    if (!S.cpu || S.over) return;
    S.aiT += dt;
    const per = persona();
    const interval = (S.diff === 'easy' ? 780 : S.diff === 'hard' ? 280 : 460) * per.think;
    if (S.aiPhase === 'think') {
      if (S.aiT < interval) return;
      S.aiT = 0;
      S.aiTarget = null;
      let best = 0, options = [];
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS - 1; c++) {
        const sc = scoreSwap(S.cpu, c, r);
        if (sc > 0) options.push({ c, r, sc });
        if (sc > best) best = sc;
      }
      options.sort((a, b) => b.sc - a.sc);
      if (options.length) {
        if (Math.random() < per.miss) {
          S.aiTarget = options[Math.min(options.length - 1, 1 + Math.floor(Math.random() * Math.min(3, options.length)))];
        } else {
          S.aiTarget = options[0];
        }
      } else if (Math.random() < per.raise && raise(S.cpu)) {
        S.aiPhase = 'wait';
        return;
      } else {
        S.aiTarget = { c: Math.floor(Math.random() * (COLS - 1)), r: Math.max(4, Math.floor(Math.random() * ROWS)) };
      }
      S.aiPhase = 'move';
    } else if (S.aiPhase === 'move') {
      if (S.aiT < (S.diff === 'hard' ? 55 : 85)) return;
      S.aiT = 0;
      const cur = S.cpuCur, tgt = S.aiTarget;
      if (!tgt) { S.aiPhase = 'think'; return; }
      if (cur.c < tgt.c) cur.c++;
      else if (cur.c > tgt.c) cur.c--;
      else if (cur.r < tgt.r) cur.r++;
      else if (cur.r > tgt.r) cur.r--;
      else S.aiPhase = 'act';
    } else if (S.aiPhase === 'act') {
      if (S.aiT < 36) return;
      S.aiT = 0;
      swap(S.cpu, S.cpuCur);
      S.cpuStop = Math.max(S.cpuStop, 8);
      S.aiPhase = 'wait';
    } else {
      if (S.aiT < interval * 0.35) return;
      S.aiT = 0;
      S.aiPhase = 'think';
      S.aiTarget = null;
    }
    if (S.cpuSp >= 100 && Math.random() < (S.diff === 'hard' ? 0.03 : 0.012)) fireSpecial(false);
  }

  function drawPanel(x, y, id) {

  const GMAT = [

  function drawGarbBlock(c0, r0, bw, bh, v, off) {
    const charId = garbageOwner();
    const mat = GMAT[charId] || GMAT[5];

  function round(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function spawnTrail(m) {
    let sx = 0, sy = 0, n = 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (!m[r][c]) continue;
      sx += c; sy += r; n++;
    }
    if (!n) return;
    const dest = { c: sx / n, r: sy / n };
    if (S.chain >= 1 && S.lastClear) {
      if (!S.trails) S.trails = [];
      const id = garbageOwner();
      S.trails.push({
        x0: (S.lastClear.c + 0.5) * panel,
        y0: (S.lastClear.r + 0.5) * panel,
        x1: (dest.c + 0.5) * panel,
        y1: (dest.r + 0.5) * panel,
        t: 1,
        id: id,
        chain: S.chain + 1
      });
      if (S.trails.length > 6) S.trails.shift();
    }
    S.lastClear = dest;
  }
  function burstParts(x, y, id, n, power) {
    if (!S.parts) S.parts = [];
    n = Math.min(24, n | 0);
    power = power || 1;
    for (let i = 0; i < n; i++) {
      const ang = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      const spd = (0.6 + Math.random() * 2.2) * (panel / 16) * power;
      S.parts.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 0.4 * power,
        life: 1,
        decay: 0.04 + Math.random() * 0.035,
        size: 1.5 + Math.random() * 2.6 * power,
        id: id,
        kind: 'burst',
        hist: [{ x: x, y: y }]
      });
    }
    if (S.parts.length > 220) S.parts.splice(0, S.parts.length - 220);
  }
  function pulseShake(amt) {
    const next = Math.min(7.5, Math.max(S.shake || 0, amt));
    S.shake = next;
  }
  function shakeFromMatch(n, chain) {
    const base = Math.pow(Math.min(8, Math.max(3, n)) / 3, 1.4) * 1.35;
    const extra = chain >= 2 ? Math.pow(chain - 1, 1.15) * 0.85 : 0;
    pulseShake(Math.min(7.2, base + extra));
  }
  function shakeFromGarb(cells) {
    pulseShake(1.1 + Math.log2(1 + cells) * 1.05);
  }

  function spawnPops(b, m) {
    if (!S.fx) S.fx = []; S.parts = [];
    if (!S.parts) S.parts = [];
    let n = 0;
    const chainBoost = Math.min(2.2, 1 + (S.chain || 0) * 0.25);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (!m[r][c]) continue;
      n++;
      const v = b[r][c];
      const id = isGarb(v) ? unpackG(v).charId : v;
      S.fx.push({ c, r, v, garb: isGarb(v), id, t: 1, chain: S.chain });
      const count = Math.min(14, Math.round((isGarb(v) ? 8 : 6) * chainBoost));
      const ox = c * panel + panel / 2;
      const oy = r * panel + panel / 2;
      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 * i) / count + Math.random() * 0.4;
        const spd = (0.8 + Math.random() * 1.8) * (panel / 18);
        S.parts.push({
          x: ox, y: oy,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - (id === 0 ? 0.6 : 0.15),
          life: 1,
          decay: 0.045 + Math.random() * 0.03,
          size: 1.6 + Math.random() * 2.4,
          id: id,
          kind: isGarb(v) ? 'garb' : 'gem',
          hist: [{ x: ox, y: oy }]
        });
      }
    }
    if (S.parts.length > 180) S.parts.splice(0, S.parts.length - 180);
    S.fx._combo = n;
    shakeFromMatch(n, S.chain || 1);
  }
  function drawParticle(p, off) {
    const x = p.x, y = p.y - off;
    const a = Math.max(0, p.life);
    const col = COLORS[p.id] || '#fff';
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = col;
    ctx.strokeStyle = col;
    const s = p.size * (0.6 + a);
    if (p.id === 0) {
      ctx.beginPath();
      ctx.moveTo(x, y - s * 1.6);
      ctx.lineTo(x + s * 0.55, y + s * 0.4);
      ctx.lineTo(x - s * 0.55, y + s * 0.4);
      ctx.closePath();
      ctx.fill();
    } else if (p.id === 1) {
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(x, y - s * 1.5);
      ctx.lineTo(x + s * 0.3, y);
      ctx.lineTo(x - s * 0.2, y + s * 0.2);
      ctx.lineTo(x + s * 0.15, y + s * 1.4);
      ctx.stroke();
    } else if (p.id === 2) {
      ctx.beginPath();
      ctx.arc(x, y, s, 0.2, Math.PI * 1.6);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x, y, s * 0.35, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.id === 3) {
      ctx.beginPath();
      ctx.ellipse(x, y, s * 0.7, s * 1.3, 0.4, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.id === 4) {
      ctx.beginPath();
      ctx.ellipse(x, y + s * 0.2, s * 0.7, s * 1.1, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.globalAlpha = a * 0.85;
      ctx.beginPath();
      ctx.arc(x, y, s * 1.1, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  function drawFx(off) {
    if (S.fx && S.fx.length) {
      const next = [];
      for (const p of S.fx) {
        p.t -= 0.12;
        if (p.t <= 0) continue;
        next.push(p);
        const x = p.c * panel + panel / 2;
        const y = p.r * panel - off + panel / 2;
        const s = panel * (0.28 + (1 - p.t) * 0.55);
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.t);
        ctx.strokeStyle = COLORS[p.id] || '#fff';
        ctx.fillStyle = COLORS[p.id] || '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, s * 0.55, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = Math.max(0, p.t * 0.28);
        ctx.beginPath();
        ctx.arc(x, y, s * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      S.fx = next;
    }
    if (S.trails && S.trails.length) {
      const keep = [];
      for (const tr of S.trails) {
        tr.t -= 0.08;
        if (tr.t <= 0) continue;
        keep.push(tr);
        const u = 1 - tr.t;
        const col = COLORS[tr.id] || '#fff';
        ctx.save();
        ctx.strokeStyle = col;
        ctx.lineWidth = 2 + Math.min(3, (tr.chain || 1) * 0.4);
        ctx.globalAlpha = Math.max(0, tr.t * 0.85);
        ctx.beginPath();
        const mx = (tr.x0 + tr.x1) / 2;
        const my = (tr.y0 + tr.y1) / 2 - panel * 0.8;
        const steps = 8;
        for (let i = 0; i <= steps; i++) {
          const tt = (i / steps) * Math.min(1, u + 0.15);
          const it = 1 - tt;
          const px = it * it * tr.x0 + 2 * it * tt * mx + tt * tt * tr.x1;
          const py = it * it * tr.y0 + 2 * it * tt * my + tt * tt * tr.y1 - off;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
        const headT = Math.min(1, u);
        const it = 1 - headT;
        const hx = it * it * tr.x0 + 2 * it * headT * mx + headT * headT * tr.x1;
        const hy = it * it * tr.y0 + 2 * it * headT * my + headT * headT * tr.y1 - off;
        ctx.globalAlpha = Math.max(0, tr.t);
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(hx, hy, 3.5 + (tr.chain || 1) * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

    if (S.parts && S.parts.length) {
      const keep = [];
      for (const p of S.parts) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;
        p.vx *= 0.96;
        p.life -= p.decay;
        if (p.life <= 0) continue;
        if (!p.hist) p.hist = [];
        p.hist.push({ x: p.x, y: p.y });
        if (p.hist.length > 6) p.hist.shift();
        keep.push(p);
        const col = COLORS[p.id] || '#fff';
        if (p.hist.length > 1) {
          ctx.save();
          ctx.strokeStyle = col;
          ctx.lineWidth = Math.max(1, p.size * 0.7);
          ctx.lineCap = 'round';
          ctx.beginPath();

          ctx.restore();

  }
  function draw() {

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (S.shake > 0) {
      const fall = S.shake * S.shake / 7.5;
      ctx.translate((Math.random() - 0.5) * fall * 2.2, (Math.random() - 0.5) * fall * 1.6);

    }

    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {

      const y = 4 + (1 - Math.min(1, S.incomingWait / 42)) * (panel * 0.4);
      drawGarbBlock(0, 0, w, Math.max(1, h), packG(charId, w), panel - y);

    const pid = (S.playerChar != null) ? S.playerChar : S.p1;
    const col = COLORS[pid] || '#fff';
    const pulse = 0.55 + Math.sin(performance.now() / 180) * 0.25;
    ctx.save();
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.35 + pulse * 0.25;
    ctx.lineWidth = 5;
    round(cx + 1, cy + 1, cw - 2, ch - 2, 7);
    ctx.stroke();
    ctx.globalAlpha = 0.95;
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#fff';
    round(cx + 3, cy + 3, cw - 6, ch - 6, 6);
    ctx.stroke();
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    const k = 7;
    const corners = [[cx+4,cy+4,1,1],[cx+cw-4,cy+4,-1,1],[cx+4,cy+ch-4,1,-1],[cx+cw-4,cy+ch-4,-1,-1]];
    ctx.beginPath();
    corners.forEach(([x,y,sx,sy]) => {
      ctx.moveTo(x, y + sy * k); ctx.lineTo(x, y); ctx.lineTo(x + sx * k, y);
    });
    ctx.stroke();
    ctx.restore();
  }

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(40, now - last);
    last = now;
    if (S.screen === 'battle' && S.board && !S.over && !S.paused) {
      if (S.freeze > 0) S.freeze -= dt / 16;
      if (S.stop > 0) S.stop -= dt / 16;
      else if (S.mode !== 'training' && S.freeze <= 0) {
        S.rising += S.riseSpeed * (dt / 16);
        if (S.rising >= 1) {
          S.rising = 0;
          if (!raise(S.board)) endGame(false);
        }
      }
      if (S.landPop > 0) S.landPop = Math.max(0, S.landPop - dt / 120);
      if (S.fallT > 0 && S.fallY) {
        S.fallT -= dt / 140;
        const tfall = Math.max(0, S.fallT);
        const ease = tfall * tfall;
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
          if (S.fallY[r][c]) S.fallY[r][c] *= 0.62;
        }
        if (S.fallT <= 0) {
          S.fallY = null; S.fallT = 0;
          S.landPop = 1;
          S.stop = Math.max(S.stop, 4);
        }
      } else if (S.stop <= 0 && !S.incomingHold) process(S.board, true);
      if (S.cpu) {
        if (S.cpuFreeze > 0) S.cpuFreeze -= dt / 16;
        if (S.cpuStop > 0) S.cpuStop -= dt / 16;
        else if (S.cpuFreeze <= 0) {
          S.cpuRising += S.riseSpeed * (dt / 16);
          if (S.cpuRising >= 1) {
            S.cpuRising = 0;
            if (!raise(S.cpu)) endGame(true);
          }
        }
        if (S.cpuStop <= 0) {
          const hit = process(S.cpu, false);
          if (hit) S.cpuStop = Math.max(S.cpuStop, 24);
        }
        runAI(dt);
      }
      applyPending();
      const topBusy = S.board[0].some(v => v !== null);
      const dtag = document.getElementById('danger-tag');
      if (dtag) {
        if (topBusy && !dtag.classList.contains('on')) sfx('danger');
        dtag.classList.toggle('on', topBusy);
      }
      draw();
    }
    requestAnimationFrame(tick);
  }

  function startBattle() {
    S.board = empty();
    seed(S.board, 6);
    S.cur = { c: 2, r: 8 };
    S.rising = 0;
    S.riseSpeed = S.mode === 'training' ? 0 : (S.diff === 'easy' ? 0.0016 : S.diff === 'hard' ? 0.004 : 0.0025);
    S.stop = 0; S.chain = 0; S.maxChain = 0; S.cleared = 0; S.sp = 0;
    S.over = false; S.won = false; S.paused = false;
    S.pendingIn = []; S.pendingOut = []; S.incomingHold = null; S.incomingWait = 0; S.fx = []; S.parts = []; S.trails = []; S.lastClear = null; S.shake = 0; S.fallY = null; S.fallT = 0; S.cascade = false;
    S.freeze = 0; S.cpuFreeze = 0;
    S.aiT = 0; S.aiPhase = 'think'; S.aiTarget = null;

    S.p1 = clampChar(S.playerChar != null ? S.playerChar : S.p1, 0);
    S.p2 = clampChar(S.cpuChar != null ? S.cpuChar : S.p2, notEmberDefault(S.p1));
    const p1 = CHARS[S.p1];
    document.getElementById('h1img').src = p1.img;
    document.getElementById('h1name').textContent = p1.name.toUpperCase();
    document.getElementById('h1sp').style.width = '0%';

    if (S.mode === 'story' || S.mode === 'vscpu') {
      S.cpu = empty();
      seed(S.cpu, 6);
      S.cpuCur = { c: 2, r: 8 };
      S.cpuRising = 0; S.cpuStop = 0; S.cpuChain = 0; S.cpuSp = 0;
      const p2 = CHARS[S.p2];
      document.getElementById('h2img').src = p2.img;
      document.getElementById('h2name').textContent = p2.name.toUpperCase();
      document.getElementById('h2sp').style.width = '0%';
      document.getElementById('h2chip').style.display = 'flex';
      document.getElementById('s-battle').style.backgroundImage = 'url("' + (p2.bg || p2.img) + '")';
    } else {
      S.cpu = null;
      document.getElementById('h2chip').style.display = 'none';
      document.getElementById('s-battle').style.backgroundImage = 'url("' + (p1.bg || p1.img) + '")';
    }
    updateSpecial();
    show('battle');
  }

  function garbageOwner() {
    const id = (S.cpuChar != null) ? S.cpuChar : S.p2;
    if (Number.isInteger(id) && id >= 0 && id < CHARS.length) return id;
    if (S.mode === 'story') return STORY[Math.min(S.storyStage | 0, 5)].boss;
    return 1;
  }
  function lockStoryOpponent() {
    S.storyStage = Math.min(loadProg(), 5);
    S.cpuChar = STORY[S.storyStage].boss;
    S.p2 = S.cpuChar;
    return S.cpuChar;
  }
  function clampChar(i, fallback) {
    if (i === null || i === undefined || i === '') {
      console.error('MGM missing character id', i);
      return fallback;
    }
    const n = Number(i);
    if (!Number.isInteger(n) || n < 0 || n >= CHARS.length) {
      console.error('MGM invalid character id', i);
      return fallback;
    }
    return n;
  }
  function notEmberDefault(except) {
    for (let i = 1; i < CHARS.length; i++) if (i !== except) return i;
    return 1;
  }
  function goVs() {
    S.playerChar = clampChar(S.p1, 0);
    S.p1 = S.playerChar;
    if (S.mode === 'story') {
      lockStoryOpponent();
    } else if (S.mode === 'vscpu') {
      S.cpuChar = clampChar(S.p2, notEmberDefault(S.playerChar));
    } else {
      S.cpuChar = notEmberDefault(S.playerChar);
    }
    S.p2 = S.cpuChar;
    const a = CHARS[S.playerChar], b = CHARS[S.cpuChar];
    document.getElementById('vs-p1').src = a.img;
    document.getElementById('vs-p2').src = b.img;
    document.getElementById('vs-names').textContent = a.name + '  VS  ' + b.name;
    if (S.mode === 'story') {
      const st = STORY[S.storyStage];
      document.getElementById('vs-label').textContent = st.title;
      document.getElementById('vs-line').textContent = st.line;
    } else {
      document.getElementById('vs-label').textContent = S.mode === 'training' ? 'TRAINING' : 'VS CPU';
      document.getElementById('vs-line').textContent = b.quote || '';
    }
    document.getElementById('s-vs').style.backgroundImage = 'url("' + b.bg + '")';
    document.getElementById('s-count').style.backgroundImage = 'url("' + b.bg + '")';
    show('vs');
    setTimeout(() => {
      show('count');
      let n = 3;
      const el = document.getElementById('count-num');
      el.textContent = '3';
      const iv = setInterval(() => {
        n--;
        if (n > 0) el.textContent = String(n);
        else if (n === 0) el.textContent = 'MAYHEM!';
        else { clearInterval(iv); startBattle(); }
      }, 550);
    }, 1200);
  }

  function buildChars() {
    const row = document.getElementById('char-row');
    row.innerHTML = '';
    let modeLabel = 'CHOOSE YOUR FIGHTER';
    if (S.mode === 'story') {
      lockStoryOpponent();
      const boss = CHARS[S.cpuChar];
      modeLabel = 'STORY ' + (S.storyStage + 1) + ' · VS ' + boss.name.toUpperCase();
    }
    else if (S.mode === 'training') modeLabel = 'TRAINING · SELECT CHARACTER';
    else if (S.pickPhase === 'cpu') modeLabel = 'CPU — CHOOSE YOUR OPPONENT';
    else modeLabel = 'PLAYER — CHOOSE YOUR FIGHTER';
    document.getElementById('char-mode').textContent = modeLabel;
    document.getElementById('btn-char-go').textContent = S.pickPhase === 'cpu' ? 'SELECT OPPONENT' : 'SELECT';
    const cur = (S.pickPhase === 'cpu') ? S.p2 : S.p1;
    CHARS.forEach((ch, i) => {
      const d = document.createElement('button');
      d.type = 'button';
      d.className = 'char-item' + (cur === i ? ' on' : '');
      d.style.borderColor = cur === i ? ch.accent : '';
      const badge = (S.pickPhase === 'cpu') ? '<small>CPU · ' + ch.icon + ' ' + ch.el + '</small>' : '<small>' + ch.icon + ' ' + ch.el + '</small>';
      d.innerHTML = '<img src="' + ch.img + '" alt="" /><span>' + ch.name.toUpperCase() + '</span>' + badge;
      d.onclick = () => selectChar(i);
      row.appendChild(d);
    });
    selectChar(cur == null ? 0 : cur);
  }
  function selectChar(i) {
    if (S.mode === 'story') {
      S.p1 = i;
      lockStoryOpponent();
    } else if (S.pickPhase === 'cpu') S.p2 = i;
    else S.p1 = i;
    const ch = CHARS[i];
    document.querySelectorAll('.char-item').forEach((el, idx) => {
      el.classList.toggle('on', idx === i);
      el.style.borderColor = idx === i ? CHARS[idx].accent : '';
    });
    document.getElementById('char-world').style.backgroundImage = 'url("' + ch.bg + '")';
    const img = document.getElementById('char-big');
    img.classList.add('swap');
    setTimeout(() => {
      img.src = ch.img;
      img.classList.remove('swap');
      img.classList.add('in');
      img.style.filter = 'drop-shadow(0 0 22px ' + ch.accent + '88)';
    }, 140);
    document.getElementById('char-info').innerHTML =
      '<div class="kicker">' + ch.subtitle + '</div>' +
      '<h3 style="color:' + ch.accent + '">' + ch.name.toUpperCase() + '</h3>' +
      '<div>' + ch.icon + ' ' + ch.el + '</div>' +
      '<div class="blurb">' + ch.desc + '</div>' +
      '<div class="tags">' + ch.play + '</div>' +
      '<div><b>PASSIVE</b> · ' + ch.passive + '</div>' +
      '<div><b>SPECIAL</b> · ' + ch.special + '</div>' +
      '<div class="statline">' + ch.stats + '</div>' +
      '<div class="world-name">WORLD · ' + ch.world + '</div>';
    const lock = document.getElementById('btn-char-go');
    lock.style.background = 'linear-gradient(135deg,' + ch.accent + ',#b026ff)';
    lock.style.boxShadow = '0 0 16px ' + ch.accent + '99';
    if (S.mode === 'story') {
      const boss = CHARS[S.cpuChar];
      document.getElementById('char-info').innerHTML +=
        '<div class="world-name" style="margin-top:8px">OPPONENT · ' + boss.icon + ' ' + boss.name.toUpperCase() + ' — LOCKED</div>';
    }
  }

  // --- UI bindings ---
  document.getElementById('btn-start').onclick = () => {
    document.getElementById('mode-hero').style.backgroundImage = 'url(assets/mode.jpg)';
    show('mode');
  };
  document.querySelectorAll('[data-mode]').forEach(btn => {
    btn.onclick = () => {
      S.mode = btn.getAttribute('data-mode');
      S.pickPhase = 'player';
      if (S.mode === 'story') lockStoryOpponent();
      if (S.mode === 'training') { buildChars(); show('char'); }
      else show('diff');
    };
  });
  document.getElementById('btn-mode-back').onclick = () => show('title');
  document.querySelectorAll('[data-diff]').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('[data-diff]').forEach(b => {
        b.classList.toggle('secondary', b !== btn);
        if (b === btn) b.classList.remove('secondary');
        else b.classList.add('secondary');
      });
      S.diff = btn.getAttribute('data-diff');
    };
  });
  document.getElementById('btn-diff-next').onclick = () => {
    S.pickPhase = 'player';
    if (S.mode === 'story') lockStoryOpponent();
    buildChars();
    show('char');
  };
  document.getElementById('btn-diff-back').onclick = () => show('mode');
  document.getElementById('btn-char-go').onclick = () => {
    if (S.mode === 'vscpu' && S.pickPhase !== 'cpu') {
      S.pickPhase = 'cpu';
      S.p2 = notEmberDefault(S.p1);
      buildChars();
      return;
    }
    goVs();
  };
  document.getElementById('btn-char-back').onclick = () => {
    if (S.mode === 'vscpu' && S.pickPhase === 'cpu') {
      S.pickPhase = 'player';
      buildChars();
      return;
    }
    if (S.mode === 'training') show('mode'); else show('diff');
  };
  document.getElementById('btn-retry').onclick = () => goVs();
  document.getElementById('btn-continue').onclick = () => {
    if (S.mode === 'story') lockStoryOpponent();
    S.pickPhase = 'player';
    buildChars();
    show('char');
  };
  document.getElementById('btn-modes').onclick = () => show('mode');

  function bind(id, fn) {
    const el = document.getElementById(id);
    el.addEventListener('click', e => { e.preventDefault(); fn(); });
    el.addEventListener('pointerdown', e => { e.preventDefault(); fn(); });
  }
  bind('b-left', () => move(-1, 0));
  bind('b-right', () => move(1, 0));
  bind('b-up', () => move(0, -1));
  bind('b-down', () => move(0, 1));
  bind('b-swap', doSwap);
  bind('b-raise', doRaise);
  bind('b-special', () => { if (!S.paused) fireSpecial(true); });
  function setPaused(on) {
    S.paused = !!on;
    const ov = document.getElementById('pause-ov');
    if (ov) ov.classList.toggle('on', S.paused);
  }
  bind('b-pause', () => { if (S.screen === 'battle' && !S.over) setPaused(!S.paused); });
  document.getElementById('btn-resume').onclick = () => setPaused(false);
  document.getElementById('btn-restart').onclick = () => { setPaused(false); goVs(); };
  document.getElementById('btn-quit').onclick = () => { setPaused(false); show('mode'); };

  window.addEventListener('keydown', e => {
    if (S.screen !== 'battle') return;
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a') { move(-1, 0); e.preventDefault(); }
    if (k === 'ArrowRight' || k === 'd') { move(1, 0); e.preventDefault(); }
    if (k === 'ArrowUp' || k === 'w') { move(0, -1); e.preventDefault(); }
    if (k === 'ArrowDown' || k === 's') { move(0, 1); e.preventDefault(); }
    if (k === 'z' || k === ' ' || k === 'x') { doSwap(); e.preventDefault(); }
    if (k === 'c' || k === 'Shift') { doRaise(); e.preventDefault(); }
    if (k === 'v' || k === 'Enter') { fireSpecial(true); e.preventDefault(); }
  });

  let pointer0 = null;
  canvas.addEventListener('pointerdown', e => {
    if (S.screen !== 'battle' || S.over) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const y = (e.clientY - rect.top) * (H / rect.height);
    S.cur.c = Math.max(0, Math.min(COLS - 2, Math.floor(x / panel)));
    S.cur.r = Math.max(0, Math.min(ROWS - 1, Math.floor(y / panel)));
    pointer0 = { x, y };
    canvas.setPointerCapture(e.pointerId);
    draw();
  });
  canvas.addEventListener('pointerup', e => {
    if (!pointer0 || S.screen !== 'battle') { pointer0 = null; return; }
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const y = (e.clientY - rect.top) * (H / rect.height);
    const dx = x - pointer0.x, dy = y - pointer0.y;
    if (Math.abs(dx) > 12 || Math.abs(dy) > 12) {
      if (Math.abs(dx) > Math.abs(dy)) doSwap();
      else move(0, dy > 0 ? 1 : -1);
    } else doSwap();
    pointer0 = null;
  });

  window.addEventListener('resize', () => { if (S.screen === 'battle') layout(); });

  // Boot
  show('title');
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
