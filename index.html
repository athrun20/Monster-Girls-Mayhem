<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Monster Girls Mayhem</title>
<style>
  :root {
    --bg: #140a22;
    --pink: #ff2d95;
    --cyan: #00f0ff;
    --yellow: #ffee00;
    --purple: #b026ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    width: 100%; height: 100%; min-height: 100vh;
    background: var(--bg); color: #fff;
    font-family: system-ui, "Segoe UI", Arial, sans-serif;
    overflow: hidden; overflow-x: hidden;
  }
  #app {
    max-width: 430px; margin: 0 auto; height: 100%; min-height: 100vh;
    position: relative; background: #140a22;
    overflow: hidden; overflow-x: hidden;
  }
  @media (min-width: 800px) {
    #app { max-width: min(1180px, 100%); }
    #hud { padding: 4px 10px 0; }
    #dock { padding: 8px 12px 10px; }
  }
  @media (min-width: 900px) and (min-height: 680px) {
    #hud { padding: 2px 10px 0; }
    #dock { padding: 4px 12px 8px; }
    #board-wrap { padding: 0 4px; min-height: 280px; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    #hud .chip { transform: scale(0.92); transform-origin: top; }
    #dock { padding: 4px 10px 6px; }
  }
  .screen {
    display: none; flex-direction: column;
    position: absolute; inset: 0; padding: 12px;
    background: #140a22;
    overflow-x: hidden;
  }
  .screen.on { display: flex; }
  h1 {
    text-align: center; font-size: 1.2rem; letter-spacing: 2px;
    color: var(--yellow); margin: 8px 0 12px;
  }
  .btn {
    display: block; width: 100%; max-width: 320px; margin: 8px auto;
    padding: 14px 18px; border-radius: 999px; border: 2px solid #fff;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: #fff; font-weight: 800; font-size: 1rem; letter-spacing: 1px;
    cursor: pointer; min-height: 52px;
  }
  .btn.secondary { background: #222; border-color: var(--cyan); }
  .btn:disabled { opacity: 0.4; }
  .btn.small { max-width: 160px; min-height: 44px; font-size: 0.85rem; padding: 10px; }

  /* TITLE — logo art + TAP TO PLAY, no clutter over faces */
  #s-title {
    align-items: center; justify-content: flex-end;
    gap: 10px; text-align: center;
    padding: 12px 12px 20px;
  }
  #s-title .art {
    flex: 1; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #s-title img {
    max-width: 96%; max-height: 100%;
    width: auto; height: auto;
    object-fit: contain;
    background: transparent;
    border: none; border-radius: 0;
    mix-blend-mode: normal;
  }
  #s-title .logo {
    font-size: 0.95rem; font-weight: 900; color: var(--pink); letter-spacing: 2px;
  }
  #s-title .logo2 {
    font-size: 1.35rem; font-weight: 900; color: var(--yellow); letter-spacing: 3px;
    margin-bottom: 4px;
  }
  #s-title #btn-start {
    width: min(320px, 92%);
    min-height: 56px;
    font-size: 1.1rem;
  }

  /* MODE — full-bleed group art, cards under */
  #s-mode { padding: 0; }
  #s-mode .hero {
    flex: 1; min-height: 0;
    background: url('assets/mode.jpg') center top / cover no-repeat #0a0614;
  }
  #s-mode .panel {
    flex-shrink: 0; padding: 10px 12px 14px;
    background: transparent;
  }
  .modes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; max-width: 420px; margin: 0 auto; }
  .modes .btn {
    max-width: none; margin: 0;
    min-height: 52px; padding: 8px 10px;
    font-size: 0.8rem; letter-spacing: 1px;
    border-radius: 14px; text-align: left;
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
    background: rgba(10,6,20,0.42) !important;
    border: 1px solid rgba(255,255,255,0.28) !important;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .modes .btn.secondary { background: rgba(10,6,20,0.38) !important; }
  .modes .btn span { font-size: 0.6rem; font-weight: 600; opacity: 0.8; letter-spacing: 0; }
  .modes .btn.wide { grid-column: auto; }

  /* DIFF — full-bleed art, controls under faces */
  #s-diff {
    padding: 0;
    justify-content: flex-end;
    background: url('assets/diff.png') center top / cover no-repeat #0a0614;
  }
  #s-diff h1 { display: none; }
  #s-diff .diff-bar {
    width: 100%;
    padding: 16px 12px 20px;
    background: transparent;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .diffs { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  .diffs .btn {
    flex: 1; margin: 0; max-width: none; font-size: 0.72rem;
    min-height: 58px; padding: 8px 6px; border-radius: 12px;
    display: flex; flex-direction: column; gap: 2px;
    background: rgba(10,6,20,0.42) !important;
    border: 1px solid rgba(255,255,255,0.28) !important;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .diffs .btn.secondary { background: rgba(10,6,20,0.38) !important; }
  .diffs .btn span { font-size: 0.56rem; font-weight: 600; opacity: 0.8; }

  /* CHAR SELECT — original 3-zone on wide screens, stacked showcase on phone */
  #s-char {
    padding: 0;
    background: #0a0614;
    overflow: hidden;
  }
  #s-char .world {
    position: absolute; inset: 0; z-index: 0;
    background-size: cover; background-position: center top;
    filter: saturate(1.15) brightness(0.7);
    transition: background-image 0.3s ease;
  }
  #s-char .world::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(8,4,18,0.72) 0%, rgba(8,4,18,0.28) 42%, rgba(8,4,18,0.78) 100%);
    pointer-events: none;
  }
  #s-char .char-shell {
    position: relative; z-index: 2;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto auto auto;
    grid-template-areas:
      "head"
      "art"
      "info"
      "roster"
      "act";
    height: 100%;
    padding: 8px 10px 10px;
    gap: 6px;
  }
  #s-char .char-head {
    grid-area: head;
    display: flex; align-items: center; gap: 10px;
  }
  #s-char .char-mode {
    font-size: 0.68rem; letter-spacing: 2px;
    color: var(--cyan); font-weight: 800; opacity: 0.9;
  }
  #s-char .char-hero-name { display: none; }
  .char-preview {
    grid-area: art;
    min-height: 0;
    max-height: 38vh;
    display: flex; align-items: flex-end; justify-content: center;
    overflow: hidden;
  }
  .char-preview img#char-big {
    max-height: 36vh; max-width: 70%;
    object-fit: contain; object-position: center bottom;
    filter: drop-shadow(0 0 22px rgba(255,45,149,0.35));
    transition: opacity 0.22s ease, transform 0.28s ease;
  }
  .char-preview img#char-big.swap { opacity: 0; transform: translateY(8px); }
  .char-info {
    grid-area: info;
    background: rgba(12,8,24,0.82);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px;
    padding: 10px 12px;
    overflow: auto;
  }
  .char-info .kicker { font-size: 0.68rem; letter-spacing: 2px; color: var(--yellow); }
  .char-info h3 { font-size: 1.35rem; letter-spacing: 2px; margin: 2px 0 4px; }
  .char-info .tags { font-size: 0.68rem; letter-spacing: 1px; opacity: 0.9; margin: 4px 0; }
  .char-info .world-name { font-size: 0.68rem; color: var(--cyan); letter-spacing: 1px; margin-top: 6px; }
  .char-info .blurb { opacity: 0.85; font-size: 0.78rem; line-height: 1.35; }
  .char-info .statline { font-size: 0.68rem; opacity: 0.8; margin-top: 4px; }
  .char-row {
    grid-area: roster;
    display: flex; gap: 6px; overflow-x: auto;
    padding: 2px 0 4px;
    scrollbar-width: none;
  }
  .char-row::-webkit-scrollbar { display: none; }
  .char-item {
    flex: 0 0 72px; min-height: 44px;
    text-align: left; cursor: pointer;
    border: 2px solid rgba(255,255,255,0.18); border-radius: 12px;
    padding: 5px; background: rgba(16,10,28,0.9);
    display: flex; flex-direction: column; align-items: center;
    color: #fff; font-family: inherit;
  }
  .char-item.on {
    border-color: var(--pink);
    box-shadow: 0 0 14px rgba(255,45,149,0.45);
  }
  .char-item img {
    width: 52px; height: 52px; object-fit: contain; object-position: center top;
    border-radius: 8px; display: block; margin-bottom: 3px;
  }
  .char-item span { font-size: 0.62rem; font-weight: 800; display: block; }
  .char-item small { font-size: 0.52rem; opacity: 0.7; display: block; }
  #s-char .char-actions { grid-area: act; }
  #btn-char-go {
    width: 100%; margin: 0;
    min-height: 52px; letter-spacing: 2px;
  }
  #btn-char-back { margin: 0; }

  @media (min-width: 800px) {
    #s-char .char-shell {
      grid-template-columns: 220px minmax(0, 1fr) 280px;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "head head head"
        "roster art info"
        "roster art act";
      padding: 14px 16px 16px;
      gap: 12px;
    }
    .char-row {
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
      gap: 8px;
    }
    .char-item {
      flex: 0 0 auto;
      width: 100%;
      flex-direction: row;
      gap: 8px;
      text-align: left;
      padding: 8px;
    }
    .char-item img { width: 48px; height: 48px; margin: 0; }
    .char-preview { align-items: center; }
    .char-preview img#char-big { max-height: 92%; }
  }

  /* VS / COUNT */
  #s-vs, #s-count, #s-ko, #s-results {
    align-items: center; justify-content: center; gap: 12px; text-align: center;
  }
  .vs-row { display: flex; align-items: center; gap: 12px; }
  .vs-row img {
    width: 38vw; max-width: 180px; height: 48vw; max-height: 240px;
    object-fit: contain; object-position: center top;
    border-radius: 12px;
  }
  #s-vs, #s-count {
    background-size: cover; background-position: center;
  }
  #count-num {
    font-size: 4rem; font-weight: 900; color: var(--yellow);
    text-shadow: 0 0 24px #ff0;
  }

  /* BATTLE */
  #s-battle {
    padding: 0;
    background: #0a0614 center center / cover no-repeat;
    background-color: #0a0614;
    overflow: hidden;
    display: none;
    flex-direction: column;
  }
  #s-battle.on { display: flex; }
  #s-battle::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: linear-gradient(90deg, rgba(8,4,18,0.28) 0%, rgba(8,4,18,0.12) 22%, transparent 42%, rgba(8,4,18,0.18) 78%, rgba(8,4,18,0.35) 100%);
  }
  #s-battle::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 48%, transparent 32%, rgba(6,2,16,0.35) 100%);
    z-index: 0;
  }
  #s-battle > * { position: relative; z-index: 1; }
  .side-art { display: none !important; }
  #fighters {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: transparent; overflow: hidden;
  }
  .fighter {
    position: absolute; bottom: 8%;
    width: 24%; max-width: 260px; height: 62%;
    display: none;
    align-items: flex-end; justify-content: center;
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    overflow: hidden;
  }
  .fighter.on { display: flex; }
  .fighter.left { left: 0; }
  .fighter.right { right: 0; }
  .fighter img {
    max-width: 100%; max-height: 100%;
    width: auto; height: 100%;
    object-fit: contain; object-position: center bottom;
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.4));
    transition: opacity 0.12s linear;
  }
  .fighter.right img { transform: scaleX(-1); }
  #board-wrap, #hud, #dock { z-index: 3; }
  .fighter.charge::after {
    content: ""; position: absolute; inset: 18% 22% 22%;
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255,200,80,0.35) 0%, rgba(255,80,0,0.12) 55%, transparent 72%);
    box-shadow: 0 0 18px rgba(255,120,20,0.35);
    animation: chargePulse 0.18s ease-out;
  }
  @keyframes chargePulse {
    0% { opacity: 0; transform: scale(0.7); }
    100% { opacity: 1; transform: scale(1); }
  }
  #atk-bolt {
    position: absolute; top: 0; left: 0; width: 16px; height: 16px;
    margin: 0; border-radius: 50%; pointer-events: none; z-index: 8; opacity: 0;
    background: radial-gradient(circle, #fff6c8 0%, #ff9a2a 38%, #ff4a00 72%, transparent 78%);
    box-shadow: 0 0 10px #ff8a20, 0 0 18px #ff3a00;
    will-change: left, top, opacity;
  }
  #atk-bolt.go { opacity: 1; }
  #atk-bolt.pwr1 { width: 18px; height: 18px; }
  #atk-bolt.pwr2 { width: 22px; height: 22px; box-shadow: 0 0 14px #ff9a30, 0 0 26px #ff3a00; }
  #atk-bolt.pwr3 { width: 26px; height: 26px; box-shadow: 0 0 18px #ffe08a, 0 0 32px #ff2a00; }
  #atk-bolt.pwr4 { width: 32px; height: 32px; box-shadow: 0 0 22px #fff2c0, 0 0 40px #ff1a00; }
  #atk-trail { position: absolute; inset: 0; pointer-events: none; z-index: 7; overflow: hidden; }
  #atk-trail i {
    position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%;
    background: radial-gradient(circle, #ffd080 0%, #ff4a00 70%, transparent 75%);
    opacity: 0.55; pointer-events: none;
  }
  #atk-hit {
    position: absolute; top: 38%; width: 54px; height: 54px; margin-left: -27px;
    border-radius: 50%; pointer-events: none; z-index: 6; opacity: 0;
    background: radial-gradient(circle, #fff6c8 0%, #ff7a18 40%, transparent 70%);
    box-shadow: 0 0 18px #ff6a00;
  }
  #atk-hit.on { animation: hitBurst 0.32s ease-out forwards; }
  #atk-hit.on-p1 { left: 14%; }
  #atk-hit.on-p2 { left: 86%; }
  @keyframes hitBurst {
    0% { opacity: 1; transform: scale(0.4); }
    70% { opacity: 0.85; transform: scale(1.15); }
    100% { opacity: 0; transform: scale(1.45); }
  }
  @media (max-width: 700px) {
    .fighter { width: 20%; height: 34%; top: 42px; bottom: auto; opacity: 0.9; }
    .fighter img { height: 100%; }
  }
  #hud {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    padding: 4px 8px 2px; flex-shrink: 0;
    min-height: 0;
  }
  #pause-fab {
    position: absolute; top: 8px; right: 8px; z-index: 8;
    width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid rgba(212,175,55,0.45);
    background: rgba(10,6,20,0.55); color: #fff; font-size: 0.7rem;
  }
  .hidden-ctrl { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #sp-ready {
    position: absolute; top: 46px; left: 10px; z-index: 6;
    font-size: 0.62rem; font-weight: 900; letter-spacing: 0.1em; color: #ffd84a;
    text-shadow: 0 0 8px #ff2bd6; opacity: 0; pointer-events: none;
  }
  #sp-ready.on { opacity: 1; }
  .hp {
    width: 76px; height: 5px; background: #1a1020; border-radius: 4px; margin-top: 2px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .hp > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff4d6d, #ffd84a); transition: width 0.18s ease-out; }
  .hp > i.hit { filter: brightness(1.45); }
  #cpu-act {
    position: absolute; top: 44px; right: 10px; z-index: 6;
    font-size: 0.62rem; font-weight: 900; letter-spacing: 0.08em;
    color: #ffd84a; text-shadow: 0 0 8px #ff2bd6;
    opacity: 0; pointer-events: none;
    transition: opacity .12s;
  }
  #cpu-act.on { opacity: 1; }
  @media (max-width: 700px) {
    #arena-title { display: none; }
    .chip img, .orb { display: none !important; }
    .chip { padding: 3px 8px !important; }
    .side-art { display: none !important; }
    .board-frame { padding: 6px !important; }
    #dock { padding: 4px 8px 8px !important; }
  }
  #arena-title { display: none !important; }
  #arena-title-off {
    text-align: center; font-size: 0.52rem; letter-spacing: 0.22em; font-weight: 800;
    color: #e8d7ff; text-shadow: 0 0 12px #b026ff, 0 1px 0 #2a0a40;
    line-height: 1.15; pointer-events: none;
  }
  #arena-title b {
    display: block; font-size: 1.05rem; letter-spacing: 0.16em; color: #fff;
    text-shadow: 0 0 16px #ff2bd6, 0 0 4px #7c3aed;
  }
  .chip {
    display: flex; align-items: center; gap: 6px;
    background: linear-gradient(180deg, rgba(28,14,42,0.88), rgba(8,4,18,0.82));
    border: 1px solid rgba(212,175,55,0.55);
    box-shadow: 0 0 10px rgba(124,58,237,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
    border-radius: 14px; padding: 4px 8px 4px 4px;
  }
  .chip.p2 { padding: 4px 4px 4px 8px; }
  .chip img { display: none !important; }
  .chip .meta { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.06em; }
  .stat { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
  .stat.rev { flex-direction: row-reverse; }
  .stat span { font-size: 0.48rem; font-weight: 800; letter-spacing: 0.08em; color: #c4b5fd; width: 14px; }
  .sp {
    width: 88px; height: 8px; background: #1a1020; border-radius: 4px; overflow: hidden;
    border: 1px solid rgba(180,120,255,0.45);
  }
  .sp > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #7c3aed, #ff2bd6); }
  .hp { width: 88px; }
  .orb { display: none !important; }
  .orb-off {
    width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid rgba(212,175,55,0.7);
    background: radial-gradient(circle at 35% 30%, #3a2060, #140818);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 0 10px rgba(124,58,237,0.4);
    flex-shrink: 0;
  }
  .orb span { font-size: 0.62rem; font-weight: 900; line-height: 1; color: #fff; }
  .orb small { font-size: 0.42rem; letter-spacing: 0.08em; color: #d4af37; }
  .orb.dim { opacity: 0.85; border-color: rgba(160,120,255,0.5); }
  .chip.aura .orb { box-shadow: 0 0 16px #ffd84a; border-color: #ffd84a; animation: spPulse 0.9s ease-in-out infinite; }
  #incoming {
    flex-shrink: 0; height: 18px; text-align: center;
    font-size: 0.65rem; letter-spacing: 1px; font-weight: 800;
    color: var(--yellow); opacity: 0;
  }
  #incoming.show { opacity: 1; }
  #incoming img { width: 18px; height: 18px; object-fit: contain; vertical-align: middle; margin: 0 4px; }
  #danger-tag {
    position: absolute; top: 52px; left: 10px; z-index: 6;
    font-size: 0.7rem; font-weight: 900; letter-spacing: 2px; color: #ff4466;
    text-shadow: 0 0 10px #f06; opacity: 0; pointer-events: none;
  }
  #danger-tag.on { opacity: 1; }
  #board-wrap {
    flex: 1 1 auto; min-height: 220px; display: flex; align-items: center; justify-content: center;
    padding: 2px 6px;
    overflow: hidden;
  }
  .board-frame {
    position: relative;
    padding: 10px 10px 12px;
    background:
      linear-gradient(180deg, rgba(42,22,70,0.55), rgba(12,6,24,0.4));
    border: 2px solid rgba(212,175,55,0.72);
    border-radius: 16px;
    box-shadow:
      0 0 0 3px rgba(60,20,90,0.65),
      0 0 22px rgba(176,38,255,0.35),
      inset 0 0 22px rgba(6,2,16,0.7), inset 0 1px 0 rgba(255,220,160,0.18);
  }
  .board-frame::before, .board-frame::after {
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 2px solid #d4af37; pointer-events: none;
  }
  .board-frame::before { top: 4px; left: 4px; border-right: 0; border-bottom: 0; }
  .board-frame::after { top: 4px; right: 4px; border-left: 0; border-bottom: 0; }
  .frame-jewel {
    position: absolute; left: 50%; width: 12px; height: 12px; margin-left: -6px;
    background: radial-gradient(circle at 35% 30%, #fff, #7c3aed 45%, #3a1060);
    border-radius: 50%; box-shadow: 0 0 8px #b026ff;
    pointer-events: none;
  }
  .frame-jewel.top { top: -6px; }
  .frame-jewel.bot { bottom: -6px; }
  #board {
    display: block;
    border: 1px solid rgba(124,58,237,0.45);
    border-radius: 8px;
    background: rgba(8,4,18,0.88);
    touch-action: none;
  }
  #dock {
    flex-shrink: 0;
    background: transparent;
    padding: 10px 12px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }

<script>
(function () {
  'use strict';

  const COLS = 6, ROWS = 12;
  const COLORS = ['#ff3b3b', '#ffd700', '#c084fc', '#4ade80', '#22d3ee', '#7c3aed'];
  const CHARS = [
    { name:'Ember', subtitle:'FOX FLAME', el:'FLAME', icon:'🔥', img:'assets/ember.jpg', bg:'assets/bg_ember.jpg', world:'KYOTO NIGHT DISTRICT', play:'AGGRESSIVE · CHAIN FOCUSED · HIGH PRESSURE', special:'Inferno Burst', passive:'Inferno Momentum — long chains add extra garbage power.', desc:'A fox firebrand. Keep the chain alive and her attacks run hotter.', stats:'ATK ★★★★  DEF ★★☆☆  SPD ★★★☆', diff:'★★★☆', accent:'#ff3b3b', quote:"Let's turn up the heat!" },
    { name:'Volt',  subtitle:'LIVE WIRE', el:'ELECTRIC', icon:'⚡', img:'assets/volt.jpg', bg:'assets/bg_volt.jpg', world:'NEON CYBER CITY', play:'FAST · COMBO · HIGH TEMPO', special:'Static Burst', passive:'Live Current — small stun nudge when Special fires.', desc:'A spark-happy alley cat. Fast swaps, faster chains.', stats:'ATK ★★★☆  DEF ★★☆☆  SPD ★★★★', diff:'★★☆☆', accent:'#ffd700', quote:"Don't blink." },
    { name:'Luna',  subtitle:'MOON RABBIT', el:'MOON', icon:'🌙', img:'assets/luna.jpg', bg:'assets/bg_luna.jpg', world:'MOONLIT DREAM CITY', play:'CONTROL · DEFENSIVE · COUNTER', special:'Lunar Halt', passive:'Still Moon — rise freezes briefly on Special.', desc:'Soft light, hard stops. She buys time and punishes greed.', stats:'ATK ★★☆☆  DEF ★★★★  SPD ★★☆☆', diff:'★★☆☆', accent:'#c084fc', quote:'The moon is listening.' },
    { name:'Ivy',   subtitle:'NATURE', el:'NATURE', icon:'🌿', img:'assets/ivy.jpg', bg:'assets/bg_ivy.jpg', world:'MAGICAL URBAN GARDEN', play:'CHAIN · SETUP · SUSTAIN', special:'Bloom Clear', passive:'Overgrowth — extra garbage clear on Special.', desc:'Vines find every gap. Plant a setup, harvest a chain.', stats:'ATK ★★★☆  DEF ★★★☆  SPD ★★☆☆', diff:'★★★☆', accent:'#4ade80', quote:'Grow through the cracks.' },
    { name:'Aqua',  subtitle:'TIDE', el:'WATER', icon:'💧', img:'assets/aqua.jpg', bg:'assets/bg_aqua.jpg', world:'NEON WATERFRONT', play:'FLEXIBLE · FLOW · RECOVERY', special:'Tidal Wash', passive:'Undertow — washes bottom-row pressure.', desc:'Let the board breathe. She clears the floor when it floods.', stats:'ATK ★★☆☆  DEF ★★★☆  SPD ★★★☆', diff:'★★☆☆', accent:'#22d3ee', quote:'Let it wash away.' },
    { name:'Shade', subtitle:'SHADOW', el:'SHADOW', icon:'🌑', img:'assets/shade.jpg', bg:'assets/bg_shade.jpg', world:'SUPERNATURAL NEON NIGHT', play:'RISK · PRESSURE · BURST', special:'Umbra Veil', passive:'Eclipse — top-row relief when Special hits.', desc:'She fights from the dark. High risk, sharp burst.', stats:'ATK ★★★★  DEF ★★☆☆  SPD ★★★☆', diff:'★★★★', accent:'#7c3aed', quote:'Stay in the dark.' }
  ];
  const STORY = [
    { boss: 0, title: 'Stage 1 · Ember', line: 'The streets heat up.' },
    { boss: 1, title: 'Stage 2 · Volt', line: 'Sparks fly in the alley.' },
    { boss: 2, title: 'Stage 3 · Luna', line: 'Moonlight softens the board.' },
    { boss: 3, title: 'Stage 4 · Ivy', line: 'Vines claim every gap.' },
    { boss: 4, title: 'Stage 5 · Aqua', line: 'The tide rises.' },
    { boss: 5, title: 'Stage 6 · Shade', line: 'Night falls on the arcade.' }
  ];
  const STORY_KEY = 'mgm_clean_story';

  const gemImgs = COLORS.map((_, i) => {
    const im = new Image();
    im.src = 'assets/gem_' + ['ember','volt','luna','ivy','aqua','shade'][i] + '.png';
    return im;
  });
  const garbImgs = COLORS.map((_, i) => {
    const im = new Image();
    im.src = 'assets/garb_' + ['ember','volt','luna','ivy','aqua','shade'][i] + '.png';
    return im;
  });
  const emberGarbImgs = [0,1,2,3].map(s => {
    const im = new Image();
    im.src = 'assets/ember_garb_' + s + '.png';
    return im;
  });

  const S = {
    screen: 'title', mode: null, diff: 'normal', p1: 0, p2: 1, playerChar: 0, cpuChar: 1,
    storyStage: 0, board: null, cpu: null,
    cur: { c: 2, r: 8 }, rising: 0, riseSpeed: 0.0025, stop: 0,
    chain: 0, maxChain: 0, cleared: 0, sp: 0, cpuSp: 0,
    over: false, won: false, paused: false, pickPhase: 'player',
    pendingIn: [], pendingOut: [], incomingHold: null, incomingWait: 0,
    cpuCur: { c: 2, r: 8 }, cpuRising: 0, cpuStop: 0, cpuChain: 0,
    aiT: 0, aiPhase: 'think', aiTarget: null,
    freeze: 0, cpuFreeze: 0, fx: [], parts: [], trails: [], lastClear: null, shake: 0, fallY: null, fallT: 0, cascade: false, landPop: 0
  };

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  let panel = 40, W = 240, H = 480;

  function show(name) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('on'));
    const el = document.getElementById('s-' + name);
    if (el) el.classList.add('on');
    S.screen = name;
    if (name === 'battle') requestAnimationFrame(() => { layout(); draw(); });
  }

  function loadProg() {
    try { return Math.max(0, Math.min(6, parseInt(localStorage.getItem(STORY_KEY) || '0', 10) || 0)); }
    catch (e) { return 0; }
  }
  function saveProg(n) {
    try {
      if (n > loadProg()) localStorage.setItem(STORY_KEY, String(n));
    } catch (e) {}
  }

  function empty() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }
  function nColors() { return S.diff === 'hard' ? 6 : 5; }
  function seed(b, rows) {
    const n = nColors();
    for (let r = ROWS - rows; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        let v, tries = 0;
        do {
          v = Math.floor(Math.random() * n);
          tries++;
        } while (tries < 12 && (
          (c >= 2 && b[r][c - 1] === v && b[r][c - 2] === v) ||
          (r >= 2 && b[r - 1][c] === v && b[r - 2][c] === v)
        ));
        b[r][c] = v;
      }
    }
  }

  function isGarb(v) { return v !== null && v >= 100; }
  let garbSeq = 1;
  function packG(charId, w) {
    const pid = (garbSeq++ % 80);
    return 1000 + pid * 100 + (charId | 0) * 10 + Math.max(1, Math.min(6, w | 0));
  }
  function unpackG(v) {
    const raw = v | 0;
    if (raw >= 1000) {
      const x = raw - 1000;
      const pid = Math.floor(x / 100);
      const rem = x - pid * 100;
      return { charId: Math.floor(rem / 10) % 6, w: rem % 10 || 1, pid: pid };
    }
    const y = raw - 100;
    return { charId: Math.floor(y / 10) % 6, w: y % 10 || 1, pid: 0 };
  }

  function layout() {
    const wrap = document.getElementById('board-wrap');
    const rect = wrap.getBoundingClientRect();
    const aw = Math.max(180, rect.width - 4);
    const ah = Math.max(240, rect.height - 4);
    const desk = window.innerWidth >= 900 && window.innerHeight >= 680;
    const cap = desk ? 110 : 96;
    const floor = desk ? 48 : 42;
    panel = Math.max(floor, Math.min(cap, Math.floor(Math.min(aw / COLS, ah / ROWS))));
    W = panel * COLS;
    H = panel * ROWS;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function gemVal(v) {
    if (v == null || v === false) return null;
    if (typeof v !== 'number' && typeof v !== 'string') return null;
    const n = v | 0;
    if (n < 0 || n >= 100) return null;
    return n;
  }
  function markMatches(b) {
    if (!b) return null;
    const m = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
    let any = false;
    for (let r = 0; r < ROWS; r++) {
      let c = 0;
      while (c < COLS) {
        const v = gemVal(b[r][c]);
        if (v == null) { c++; continue; }
        let c2 = c + 1;
        while (c2 < COLS && gemVal(b[r][c2]) === v) c2++;
        if (c2 - c >= 3) { for (let k = c; k < c2; k++) m[r][k] = true; any = true; }
        c = c2;
      }
    }
    for (let c = 0; c < COLS; c++) {
      let r = 0;
      while (r < ROWS) {
        const v = gemVal(b[r][c]);
        if (v == null) { r++; continue; }
        let r2 = r + 1;
        while (r2 < ROWS && gemVal(b[r2][c]) === v) r2++;
        if (r2 - r >= 3) { for (let k = r; k < r2; k++) m[k][c] = true; any = true; }
        r = r2;
      }
    }
    return any ? m : null;
  }
  function hitsMap(b) {
    if (b && S.cpu && b === S.cpu) {
      if (!S.cpuGarbHits) S.cpuGarbHits = {};
      return S.cpuGarbHits;
    }
    if (!S.garbHits) S.garbHits = {};
    return S.garbHits;
  }
  function maxMap(b) {
    if (b && S.cpu && b === S.cpu) {
      if (!S.cpuGarbMax) S.cpuGarbMax = {};
      return S.cpuGarbMax;
    }
    if (!S.garbMax) S.garbMax = {};
    return S.garbMax;
  }
  function lastGarbColOf(b) {
    if (b && S.cpu && b === S.cpu) return S.cpuLastGarbCol;
    return S.lastGarbCol;
  }
  function setLastGarbCol(b, c) {
    if (b && S.cpu && b === S.cpu) S.cpuLastGarbCol = c;
    else S.lastGarbCol = c;
  }
  function isBreakingPid(pid) {
    return !!(S.garbBreak && S.garbBreak.some(function (x) { return x.pid === pid; }));
  }
  function convertGarbPid(b, pid) {
    if (!b) return 0;
    const hits = hitsMap(b);
    const maxM = maxMap(b);
    delete hits[pid];
    delete maxM[pid];
    let gems = 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const v = b[r][c];
      if (!isGarb(v) || unpackG(v).pid !== pid) continue;
      let gem = rollGem(b, r, c, true);
      if (gem == null || isGarb(gem) || gem < 0 || gem > 7) gem = (r + c) % nColors();
      b[r][c] = gem;
      gems++;
    }
    return gems;
  }
  function queueGarbBreak(gv) {
    const u = unpackG(gv);
    if (!S.garbBreak) S.garbBreak = [];
    if (isBreakingPid(u.pid)) return;
    S.garbBreak.push({ pid: u.pid, gv: gv, t: 120 });
    const gems = convertGarbPid(S.board, u.pid);
    if (gems) {
      S.cleared += gems;
      S.sp = Math.min(100, S.sp + Math.min(10, 2 + gems));
      setSpUi('p1', S.sp);
      updateSpecial();

        ctx.globalAlpha = Math.min(1, f.t * 1.4);
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = COLORS[f.id] || '#ffd84a';
        ctx.lineWidth = 3;
        ctx.font = '900 ' + Math.round(panel * (0.42 + Math.min(0.2, (f.n - 3) * 0.04)) * pop) + 'px system-ui,sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const fy = f.y - off - (1 - f.t) * panel * 0.7;
        const label = f.n >= 4 ? String(f.n) : String(f.n);
        ctx.strokeText(label, f.x, fy);
        ctx.fillText(label, f.x, fy);
        ctx.restore();
      }
      S.floats = keepF;
    }
    if (S.trails && S.trails.length) {
      const keep = [];
      for (const tr of S.trails) {
        tr.t -= 0.08;
        if (tr.t <= 0) continue;
        keep.push(tr);
        const u = 1 - tr.t;
        const col = COLORS[tr.id] || '#fff';
        ctx.save();
        ctx.strokeStyle = col;
        ctx.lineWidth = 2 + Math.min(3, (tr.chain || 1) * 0.4);
        ctx.globalAlpha = Math.max(0, tr.t * 0.85);
        ctx.beginPath();
        const mx = (tr.x0 + tr.x1) / 2;
        const my = (tr.y0 + tr.y1) / 2 - panel * 0.8;
        const steps = 8;
        for (let i = 0; i <= steps; i++) {
          const tt = (i / steps) * Math.min(1, u + 0.15);
          const it = 1 - tt;
          const px = it * it * tr.x0 + 2 * it * tt * mx + tt * tt * tr.x1;
          const py = it * it * tr.y0 + 2 * it * tt * my + tt * tt * tr.y1 - off;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
        const headT = Math.min(1, u);
        const it = 1 - headT;
        const hx = it * it * tr.x0 + 2 * it * headT * mx + headT * headT * tr.x1;
        const hy = it * it * tr.y0 + 2 * it * headT * my + headT * headT * tr.y1 - off;
        ctx.globalAlpha = Math.max(0, tr.t);
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(hx, hy, 3.5 + (tr.chain || 1) * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        if (Math.random() < 0.45) burstParts(hx, hy + off, tr.id, 2, 0.55);
      }
      S.trails = keep;
    }
    if (S.parts && S.parts.length) {
      const keep = [];
      for (const p of S.parts) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;
        p.vx *= 0.96;
        p.life -= p.decay;
        if (p.life <= 0) continue;
        if (!p.hist) p.hist = [];
        p.hist.push({ x: p.x, y: p.y });
        if (p.hist.length > 6) p.hist.shift();
        keep.push(p);
        const col = COLORS[p.id] || '#fff';
        if (p.hist.length > 1) {
          ctx.save();
          ctx.strokeStyle = col;
          ctx.lineWidth = Math.max(1, p.size * 0.7);
          ctx.lineCap = 'round';
          ctx.beginPath();
          for (let i = 0; i < p.hist.length; i++) {
            const hx = p.hist[i].x, hy = p.hist[i].y - off;
            if (i === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
          }
          ctx.globalAlpha = Math.max(0, p.life * 0.45);
          ctx.stroke();
          ctx.restore();
        }
        drawParticle(p, off);
      }
      S.parts = keep;
    }
  }
  function draw() {
    if (S.screen !== 'battle' || !S.board) return;
    const off = S.rising * panel;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (S.shake > 0) {
      const fall = S.shake * S.shake / 7.5;
      ctx.translate((Math.random() - 0.5) * fall * 2.2, (Math.random() - 0.5) * fall * 1.6);
      S.shake *= 0.78;
      if (S.shake < 0.18) S.shake = 0;
    }
    ctx.fillStyle = 'rgba(10,6,22,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let c = 1; c < COLS; c++) {
      ctx.beginPath(); ctx.moveTo(c * panel, 0); ctx.lineTo(c * panel, H); ctx.stroke();
    }
    for (let r = 1; r < ROWS; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * panel); ctx.lineTo(W, r * panel); ctx.stroke();
    }
    const seenG = Array.from({ length: ROWS }, function () { return Array(COLS).fill(false); });
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const v = S.board[r][c];
      if (v === null) continue;
      const fy = (S.fallY && S.fallY[r] && S.fallY[r][c]) ? S.fallY[r][c] : 0;
      if (!isGarb(v)) {
        drawPanel(c * panel, r * panel - off + fy, v);
        continue;
      }
      if (seenG[r][c]) continue;
      const mass = collectGarbMass(c, r, seenG);
      drawGarbMass(mass, off);
    }
    drawFx(off);
    // two-cell cursor: same grid + rise offset as gems
    const cr = Math.max(0, Math.min(ROWS - 1, S.cur.r | 0));
    const cc = Math.max(0, Math.min(COLS - 2, S.cur.c | 0));
    const cx = cc * panel, cy = cr * panel - off;
    const cw = panel * 2, ch = panel;
    const pid = (S.playerChar != null) ? S.playerChar : S.p1;
    const col = COLORS[pid] || '#ffe08a';
    const pulse = 0.62 + Math.sin(performance.now() / 260) * 0.22;
    if (S.curFlash > 0) S.curFlash -= 0.08;
    ctx.save();
    const emptyL = !S.board[cr] || S.board[cr][cc] == null;
    const emptyR = !S.board[cr] || S.board[cr][cc + 1] == null;
    if (emptyL || emptyR) {
      ctx.globalAlpha = 0.12 + pulse * 0.08;
      ctx.fillStyle = col;
      if (emptyL) ctx.fillRect(cx + 3, cy + 3, panel - 6, ch - 6);
      if (emptyR) ctx.fillRect(cx + panel + 3, cy + 3, panel - 6, ch - 6);
    }
    ctx.shadowColor = col;
    ctx.shadowBlur = 8 + pulse * 6 + (S.curFlash > 0 ? 8 : 0);
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.55 + pulse * 0.35;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    const inset = 2.5, k = Math.max(6, panel * 0.22);
    const x0 = cx + inset, y0 = cy + inset, x1 = cx + cw - inset, y1 = cy + ch - inset;
    [[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]].forEach(([x,y,sx,sy]) => {
      ctx.moveTo(x, y + sy * k); ctx.lineTo(x, y); ctx.lineTo(x + sx * k, y);
    });
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.15;
    ctx.stroke();
    ctx.restore();
  }

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(40, now - last);
    last = now;
    if (S.screen === 'battle') tickPoses(dt);
    if (S.screen === 'battle' && S.board && !S.over && !S.paused) {
      S.battleMs = (S.battleMs || 0) + dt;
      if (S.cpuAtkCool > 0) S.cpuAtkCool -= dt / 16;
      if (S.pAtkCool > 0) S.pAtkCool -= dt / 16;
      if (S.garbRecover > 0) S.garbRecover -= dt / 16;
      if (S.riseCool > 0) S.riseCool -= dt;
      if (S.freeze > 0) S.freeze -= dt / 16;
      if (S.stop > 0) S.stop -= dt / 16;
      if (S.riseAnim) {
        S.rising += dt / 200;
        if (S.rising >= 1) {
          S.rising = 0;
          S.riseAnim = false;
          S.riseCool = Math.max(S.riseCool || 0, 700);
          if (!tryPlayerRaise()) { /* skipped or KO if settled */ }
        }
      } else if (S.mode !== 'training' && S.freeze <= 0 && S.stop <= 0 && (S.riseCool || 0) <= 0) {
        S.rising += currentRise() * (dt / 16);
        if (S.rising >= 1) {
          S.rising = 0;
          S.riseCool = 480;
          tryPlayerRaise();
        }
      }
      if (S.landPop > 0) S.landPop = Math.max(0, S.landPop - dt / 120);
      if (S.garbBreak && S.garbBreak.length) {
        for (let i = 0; i < S.garbBreak.length; i++) S.garbBreak[i].t -= dt;
        resolveGarbBreak(false);
      }
      if (S.fallT > 0 && S.fallY) {
        S.fallT -= dt / 70;
        const tfall = Math.max(0, S.fallT);
        const ease = tfall * tfall;
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
          if (S.fallY[r][c]) S.fallY[r][c] *= 0.62;
        }
        if (S.fallT <= 0) {
          S.fallY = null; S.fallT = 0;
          S.landPop = 1;
          S.stop = 0;
          process(S.board, true);
        }
      } else if (!(S.fallT > 0)) {
        process(S.board, true);
      }
      if (S.cpu) {
        if (S.cpuFreeze > 0) S.cpuFreeze -= dt / 16;
        if (S.cpuStop > 0) S.cpuStop -= dt / 16;
        if (S.cpuFreeze <= 0 && S.cpuStop <= 0) {
          if ((S.cpuRiseCool || 0) > 0) S.cpuRiseCool -= dt;
          else {
            S.cpuRising = (S.cpuRising || 0) + currentRise() * (dt / 16);
            if (S.cpuRising >= 1) {
              S.cpuRising = 0;
              S.cpuRiseCool = 700;
              if (!raise(S.cpu)) endGame(true);
            }
          }
        }
        if (S.cpuStop <= 0) {
          const hit = process(S.cpu, false);
          if (hit) S.cpuStop = Math.max(S.cpuStop, 24);
        }
        runAI(dt);
      }
      applyPending();
      let topFill = 0;
      for (let c = 0; c < COLS; c++) if (S.board[0][c] != null) topFill++;
      const topBusy = topFill >= 2;
      const dtag = document.getElementById('danger-tag');
      if (dtag) {
        if (topBusy && !S.pDanger) { sfx('danger'); }
        S.pDanger = topBusy;
        if (S.cpu && S.cpu[0]) S.cpuDanger = S.cpu[0].some(v => v !== null);
        if ((S.cpuPoseHold || 0) <= 0 && charIdOf('cpu') === 0) applyPose('cpu', persistPose('cpu'));
        if (topBusy && (S.pPoseHold || 0) <= 0) setPose('p1', persistPose('p1'), 0);
        else if (!topBusy && (S.pPoseHold || 0) <= 0) setPose('p1', persistPose('p1'), 0);
        dtag.classList.toggle('on', topBusy);
        const h1 = document.getElementById('h1hp');
        if (h1) {
          let filled = 0;
          for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (S.board[r][c] != null) { filled++; break; }
          const hp = Math.max(8, Math.round((1 - (ROWS - filled) / ROWS) * 100));
          h1.style.width = (100 - Math.round(((ROWS - filled) / ROWS) * 70)) + '%';
        }
      }
      draw();
    }
    requestAnimationFrame(tick);
  }

  function startBattle() {
    S.board = empty();
    seed(S.board, 6);
    S.cur = { c: 2, r: 8 }; S.curFlash = 0;
    S.rising = 0;
    S.riseSpeed = S.mode === 'training' ? 0 : (S.diff === 'easy' ? 0.0016 : S.diff === 'hard' ? 0.004 : 0.0025);
    S.battleMs = 0; S.cpuAtkCool = 0; S.pAtkCool = 0; S.garbRecover = 0;
    S.riseCool = 0; S.riseAnim = false; S.cpuRiseCool = 0; S.cpuRising = 0;
    S.pAtkQ = []; S.cpuAtkQ = []; S.pAtkBusy = false; S.cpuAtkBusy = false;
    S.stop = 0; S.chain = 0; S.maxChain = 0; S.cleared = 0; S.sp = 0;
    S.over = false; S.won = false; S.paused = false;
    S.pHp = 100; S.cpuHp = 100; setHpUi('p1', 100); setHpUi('cpu', 100);
    S.pendingIn = []; S.pendingOut = []; S.incomingHold = null; S.incomingWait = 0; S.fx = []; S.parts = []; S.trails = []; S.lastClear = null; S.shake = 0; S.fallY = null; S.fallT = 0; S.cascade = false; S.floats = []; S.garbFx = []; S.garbBreak = []; S.garbHits = {}; S.cpuGarbHits = {}; S.garbMax = {}; S.cpuGarbMax = {}; S.lastGarbCol = -1; S.cpuLastGarbCol = -1; S.spReadyLatched = false; S.pMood = 'IDLE'; S.cpuMood = 'IDLE';
    S.freeze = 0; S.cpuFreeze = 0;
    S.aiT = 0; S.aiPhase = 'think'; S.aiTarget = null;

    S.p1 = clampChar(S.playerChar != null ? S.playerChar : S.p1, 0);
    S.p2 = clampChar(S.cpuChar != null ? S.cpuChar : S.p2, notEmberDefault(S.p1));
    const p1 = CHARS[S.p1];
    document.getElementById('h1img').src = p1.img;
    document.getElementById('h1name').textContent = p1.name.toUpperCase();
    setSpUi('p1', 0);
    const side1 = document.getElementById('side-p1');
    if (side1) side1.src = p1.img;
    const o1 = document.getElementById('orb-p1n');
    if (o1) o1.textContent = '0';
    S.pPose = 'IDLE'; S.cpuPose = 'IDLE'; S.pPoseHold = 0; S.cpuPoseHold = 0;
    S.pNextPose = null; S.cpuNextPose = null;
    S.pDanger = false; S.cpuDanger = false;

    if (S.mode === 'story' || S.mode === 'vscpu') {
      S.cpu = empty();
      seed(S.cpu, 6);
      S.cpuCur = { c: 2, r: 8 };
      S.cpuRising = 0; S.cpuStop = 0; S.cpuChain = 0; S.cpuSp = 0;
      const p2 = CHARS[S.p2];
      document.getElementById('h2img').src = p2.img;
      document.getElementById('h2name').textContent = p2.name.toUpperCase();
      setSpUi('cpu', 0);
      document.getElementById('h2chip').style.display = 'flex';
      showFighters();
      const side2 = document.getElementById('side-p2');
      if (side2) { side2.src = p2.img; side2.style.display = ''; }
      const o2 = document.getElementById('orb-p2n');
      if (o2) o2.textContent = '0';
      document.getElementById('s-battle').style.backgroundImage = 'url("' + (p2.bg || p2.img) + '")';
    } else {
      S.cpu = null;
      document.getElementById('h2chip').style.display = 'none';
      showFighters();
      const s2 = document.getElementById('side-p2'); if (s2) s2.removeAttribute('src');
      document.getElementById('s-battle').style.backgroundImage = 'url("' + (p1.bg || p1.img) + '")';
    }
    updateSpecial();
    show('battle');
  }

  function garbageOwner() {
    const id = (S.cpuChar != null) ? S.cpuChar : S.p2;
    if (Number.isInteger(id) && id >= 0 && id < CHARS.length) return id;
    if (S.mode === 'story') return STORY[Math.min(S.storyStage | 0, 5)].boss;
    return 1;
  }
  function lockStoryOpponent() {
    S.storyStage = Math.min(loadProg(), 5);
    S.cpuChar = STORY[S.storyStage].boss;
    S.p2 = S.cpuChar;
    return S.cpuChar;
  }
  function clampChar(i, fallback) {
    if (i === null || i === undefined || i === '') {
      console.error('MGM missing character id', i);
      return fallback;
    }
    const n = Number(i);
    if (!Number.isInteger(n) || n < 0 || n >= CHARS.length) {
      console.error('MGM invalid character id', i);
      return fallback;
    }
    return n;
  }
  function notEmberDefault(except) {
    for (let i = 1; i < CHARS.length; i++) if (i !== except) return i;
    return 1;
  }
  function goVs() {
    S.playerChar = clampChar(S.p1, 0);
    S.p1 = S.playerChar;
    if (S.mode === 'story') {
      lockStoryOpponent();
    } else if (S.mode === 'vscpu') {
      S.cpuChar = clampChar(S.p2, notEmberDefault(S.playerChar));
    } else {
      S.cpuChar = notEmberDefault(S.playerChar);
    }
    S.p2 = S.cpuChar;
    const a = CHARS[S.playerChar], b = CHARS[S.cpuChar];
    document.getElementById('vs-p1').src = a.img;
    document.getElementById('vs-p2').src = b.img;
    document.getElementById('vs-names').textContent = a.name + '  VS  ' + b.name;
    if (S.mode === 'story') {
      const st = STORY[S.storyStage];
      document.getElementById('vs-label').textContent = st.title;
      document.getElementById('vs-line').textContent = st.line;
    } else {
      document.getElementById('vs-label').textContent = S.mode === 'training' ? 'TRAINING' : 'VS CPU';
      document.getElementById('vs-line').textContent = b.quote || '';
    }
    document.getElementById('s-vs').style.backgroundImage = 'url("' + b.bg + '")';
    document.getElementById('s-count').style.backgroundImage = 'url("' + b.bg + '")';
    show('vs');
    setTimeout(() => {
      show('count');
      let n = 3;
      const el = document.getElementById('count-num');
      el.textContent = '3';
      const iv = setInterval(() => {
        n--;
        if (n > 0) el.textContent = String(n);
        else if (n === 0) el.textContent = 'MAYHEM!';
        else { clearInterval(iv); startBattle(); }
      }, 550);
    }, 1200);
  }

  function buildChars() {
    const row = document.getElementById('char-row');
    row.innerHTML = '';
    let modeLabel = 'CHOOSE YOUR FIGHTER';
    if (S.mode === 'story') {
      lockStoryOpponent();
      const boss = CHARS[S.cpuChar];
      modeLabel = 'STORY ' + (S.storyStage + 1) + ' · VS ' + boss.name.toUpperCase();
    }
    else if (S.mode === 'training') modeLabel = 'TRAINING · SELECT CHARACTER';
    else if (S.pickPhase === 'cpu') modeLabel = 'CPU — CHOOSE YOUR OPPONENT';
    else modeLabel = 'PLAYER — CHOOSE YOUR FIGHTER';
    document.getElementById('char-mode').textContent = modeLabel;
    document.getElementById('btn-char-go').textContent = S.pickPhase === 'cpu' ? 'SELECT OPPONENT' : 'SELECT';
    const cur = (S.pickPhase === 'cpu') ? S.p2 : S.p1;
    CHARS.forEach((ch, i) => {
      const d = document.createElement('button');
      d.type = 'button';
      d.className = 'char-item' + (cur === i ? ' on' : '');
      d.style.borderColor = cur === i ? ch.accent : '';
      const badge = (S.pickPhase === 'cpu') ? '<small>CPU · ' + ch.icon + ' ' + ch.el + '</small>' : '<small>' + ch.icon + ' ' + ch.el + '</small>';
      d.innerHTML = '<img src="' + ch.img + '" alt="" /><span>' + ch.name.toUpperCase() + '</span>' + badge;
      d.onclick = () => selectChar(i);
      row.appendChild(d);
    });
    selectChar(cur == null ? 0 : cur);
  }
  function selectChar(i) {
    if (S.mode === 'story') {
      S.p1 = i;
      lockStoryOpponent();
    } else if (S.pickPhase === 'cpu') S.p2 = i;
    else S.p1 = i;
    const ch = CHARS[i];
    document.querySelectorAll('.char-item').forEach((el, idx) => {
      el.classList.toggle('on', idx === i);
      el.style.borderColor = idx === i ? CHARS[idx].accent : '';
    });
    document.getElementById('char-world').style.backgroundImage = 'url("' + ch.bg + '")';
    const img = document.getElementById('char-big');
    img.classList.add('swap');
    setTimeout(() => {
      img.src = ch.img;
      img.classList.remove('swap');
      img.classList.add('in');
      img.style.filter = 'drop-shadow(0 0 22px ' + ch.accent + '88)';
    }, 140);
    document.getElementById('char-info').innerHTML =
      '<div class="kicker">' + ch.subtitle + '</div>' +
      '<h3 style="color:' + ch.accent + '">' + ch.name.toUpperCase() + '</h3>' +
      '<div>' + ch.icon + ' ' + ch.el + '</div>' +
      '<div class="blurb">' + ch.desc + '</div>' +
      '<div class="tags">' + ch.play + '</div>' +
      '<div><b>PASSIVE</b> · ' + ch.passive + '</div>' +
      '<div><b>SPECIAL</b> · ' + ch.special + '</div>' +
      '<div class="statline">' + ch.stats + '</div>' +
      '<div class="world-name">WORLD · ' + ch.world + '</div>';
    const lock = document.getElementById('btn-char-go');
    lock.style.background = 'linear-gradient(135deg,' + ch.accent + ',#b026ff)';
    lock.style.boxShadow = '0 0 16px ' + ch.accent + '99';
    if (S.mode === 'story') {
      const boss = CHARS[S.cpuChar];
      document.getElementById('char-info').innerHTML +=
        '<div class="world-name" style="margin-top:8px">OPPONENT · ' + boss.icon + ' ' + boss.name.toUpperCase() + ' — LOCKED</div>';
    }
  }

  // --- UI bindings ---
  document.getElementById('btn-start').onclick = () => {
    document.getElementById('mode-hero').style.backgroundImage = 'url(assets/mode.jpg)';
    show('mode');
  };
  document.querySelectorAll('[data-mode]').forEach(btn => {
    btn.onclick = () => {
      S.mode = btn.getAttribute('data-mode');
      S.pickPhase = 'player';

      if (S.mode === 'training') { buildChars(); show('char'); }
      else show('diff');

  document.getElementById('btn-mode-back').onclick = () => show('title');

    btn.onclick = () => {
      document.querySelectorAll('[data-diff]').forEach(b => {
        b.classList.toggle('secondary', b !== btn);
        if (b === btn) b.classList.remove('secondary');
        else b.classList.add('secondary');
      });
      S.diff = btn.getAttribute('data-diff');
    };
  });
  document.getElementById('btn-diff-next').onclick = () => {
    S.pickPhase = 'player';
    if (S.mode === 'story') lockStoryOpponent();
    buildChars();
    show('char');
  };
  document.getElementById('btn-diff-back').onclick = () => show('mode');
  document.getElementById('btn-char-go').onclick = () => {
    if (S.mode === 'vscpu' && S.pickPhase !== 'cpu') {
      S.pickPhase = 'cpu';
      S.p2 = notEmberDefault(S.p1);
      buildChars();
      return;
    }
    goVs();
  };
  document.getElementById('btn-char-back').onclick = () => {
    if (S.mode === 'vscpu' && S.pickPhase === 'cpu') {
      S.pickPhase = 'player';
      buildChars();
      return;
    }
    if (S.mode === 'training') show('mode'); else show('diff');
  };
  document.getElementById('btn-retry').onclick = () => goVs();
  document.getElementById('btn-continue').onclick = () => {
    if (S.mode === 'story') lockStoryOpponent();
    S.pickPhase = 'player';
    buildChars();
    show('char');
  };
  document.getElementById('btn-modes').onclick = () => show('mode');

  function bind(id, fn) {
    const el = document.getElementById(id);
    el.addEventListener('click', e => { e.preventDefault(); fn(); });
    el.addEventListener('pointerdown', e => { e.preventDefault(); fn(); });
  }
  bind('b-left', () => move(-1, 0));
  bind('b-right', () => move(1, 0));
  bind('b-up', () => move(0, -1));
  bind('b-down', () => move(0, 1));
  bind('b-swap', doSwap);
  bind('b-raise', doRaise);
  bind('b-special', () => { if (!S.paused) fireSpecial(true); });
  function setPaused(on) {
    S.paused = !!on;
    const ov = document.getElementById('pause-ov');
    if (ov) ov.classList.toggle('on', S.paused);
  }
  bind('b-pause', () => { if (S.screen === 'battle' && !S.over) setPaused(!S.paused); });
  bind('pause-fab', () => { if (S.screen === 'battle' && !S.over) setPaused(!S.paused); });
  document.getElementById('btn-resume').onclick = () => setPaused(false);
  document.getElementById('btn-restart').onclick = () => { setPaused(false); goVs(); };
  document.getElementById('btn-quit').onclick = () => { setPaused(false); show('mode'); };

  window.addEventListener('keydown', e => {
    if (S.screen !== 'battle') return;
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a') { move(-1, 0); e.preventDefault(); }
    if (k === 'ArrowRight' || k === 'd') { move(1, 0); e.preventDefault(); }
    if (k === 'ArrowUp' || k === 'w') { move(0, -1); e.preventDefault(); }
    if (k === 'ArrowDown' || k === 's') { move(0, 1); e.preventDefault(); }
    if (k === 'z' || k === ' ' || k === 'x') { doSwap(); e.preventDefault(); }
    if (k === 'c' || k === 'r' || k === 'R' || k === 'Shift') { doRaise(); e.preventDefault(); }
    if (k === 'v' || k === 'Enter') { fireSpecial(true); e.preventDefault(); }
  });

  let pointer0 = null;
  canvas.addEventListener('pointerdown', e => {
    if (S.screen !== 'battle' || S.over) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const y = (e.clientY - rect.top) * (H / rect.height);
    S.cur.c = Math.max(0, Math.min(COLS - 2, Math.floor(x / panel)));
    S.cur.r = Math.max(0, Math.min(ROWS - 1, Math.floor(y / panel)));
    pointer0 = { x, y };
    canvas.setPointerCapture(e.pointerId);
    draw();
  });
  canvas.addEventListener('pointerup', e => {
    if (!pointer0 || S.screen !== 'battle') { pointer0 = null; return; }
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const y = (e.clientY - rect.top) * (H / rect.height);
    const dx = x - pointer0.x, dy = y - pointer0.y;
    if (Math.abs(dx) > 12 || Math.abs(dy) > 12) {
      if (Math.abs(dx) > Math.abs(dy)) doSwap();
      else move(0, dy > 0 ? 1 : -1);
    } else doSwap();
    pointer0 = null;
  });

  window.addEventListener('resize', () => { if (S.screen === 'battle') layout(); });

  window.__mgmGarb = {
    COLS: COLS,
    ROWS: ROWS,
    buildGarbage: buildGarbage,
    garbPattern: garbPattern,
    placePattern: placePattern,
    placeGarbage: placeGarbage,
    packG: packG,
    unpackG: unpackG,
    hitsMap: hitsMap,
    rollGem: rollGem,
    markMatches: markMatches,
    findMatches: findMatches,
    empty: empty,
    seed: seed,
    colHeight: colHeight,
    playableOk: playableOk,
    getS: function () { return S; },
    stats: function (b) {
      b = b || S.board;
      const colH = [];
      let garbCells = 0, maxRun = 0;
      const slabs = {};
      for (let c = 0; c < COLS; c++) {
        colH.push(colHeight(b, c));
        let run = 0;
        for (let r = 0; r < ROWS; r++) {
          if (isGarb(b[r][c])) {
            garbCells++;
            slabs[unpackG(b[r][c]).pid] = 1;
            run++;
            if (run > maxRun) maxRun = run;
          } else run = 0;
        }
      }
      let topFree = 0;
      for (let r = 0; r < 4; r++) for (let c = 0; c < COLS; c++) if (b[r][c] == null) topFree++;
      return {
        colH: colH,
        garbCells: garbCells,
        slabs: Object.keys(slabs).length,
        maxH: Math.max.apply(null, colH),
        maxGarbRun: maxRun,
        topFree: topFree
      };
    }
  };

  // Boot
  show('title');
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
